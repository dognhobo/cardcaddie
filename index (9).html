          </div>

          {/* What it does */}
          <div style={{background:"rgba(10,61,31,0.85)",borderRadius:14,padding:16,marginBottom:14}}>
            <div style={{fontSize:11,color:"#86efac",letterSpacing:1,marginBottom:10}}>WHAT YOUR ID DOES</div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {[
                ["📊","Your stats sync to the cloud automatically"],
                ["📱","Switch phones without losing your history"],
                ["🔗","Join live rounds on any device with your ID"],
                ["🔒","Only you can see your stats — it's private"],
              ].map(([icon,text],i) => (
                <div key={i} style={{display:"flex",alignItems:"center",gap:10}}>
                  <span style={{fontSize:18}}>{icon}</span>
                  <span style={{fontSize:12,color:"rgba(255,255,255,0.7)"}}>{text}</span>
                </div>
              ))}
            </div>
          </div>

          {/* Email backup */}
          <div style={{background:"rgba(10,61,31,0.85)",borderRadius:14,padding:16,marginBottom:14}}>
            <div style={{fontSize:11,color:"#86efac",letterSpacing:1,marginBottom:6}}>OPTIONAL — BACKUP WITH EMAIL</div>
            <div style={{fontSize:11,color:"rgba(255,255,255,0.5)",marginBottom:10}}>Add an email so you can recover your ID if you lose it</div>
            {saved ? (
              <div style={{textAlign:"center",padding:12,color:"#86efac",fontSize:13,fontWeight:700}}>✓ Email saved!</div>
            ) : (
              <div style={{display:"flex",gap:8}}>
                <input value={email} onChange={e=>setEmail(e.target.value)} placeholder="your@email.com" type="email"
                  style={{flex:1,padding:"10px",borderRadius:10,border:"1px solid rgba(255,255,255,0.15)",background:"rgba(255,255,255,0.06)",color:"#fff",fontSize:13,outline:"none",fontFamily:"Georgia,serif"}} />
                <button onClick={saveEmail} style={{padding:"10px 14px",borderRadius:10,border:"none",background:"#22c55e",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"Georgia,serif"}}>Save</button>
              </div>
            )}
          </div>

          <div style={{background:"rgba(10,61,31,0.85)",borderRadius:14,padding:14,textAlign:"center"}}>
            <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",lineHeight:1.6}}>
              Screenshot or write down your Player ID.<br/>You'll need it to sync stats to a new device.
            </div>
          </div>
        </div>
      );
    }

    // ── LIVE ROUND SCREEN ─────────────────────────────────────────────────────
    function LiveRoundScreen({ onBack, onStartLive }) {
      const [mode, setMode] = React.useState(null); // 'create' | 'join'
      const [code, setCode] = React.useState('');
      const [loading, setLoading] = React.useState(false);
      const [error, setError] = React.useState('');
      const [liveData, setLiveData] = React.useState(null);
      const playerId = getOrCreatePlayerId();

      const createRoom = async () => {
        setLoading(true);
        const roomCode = Math.random().toString(36).substring(2,6).toUpperCase();
        try { await pushLiveRound(roomCode, { players:[], course:{name:'Host is setting up…'}, format:'', courseKey:null, nineHoles:false }, []); } catch(e) {}
        setCode(roomCode);
        setMode('created');
        setLoading(false);
      };

      const joinRoom = async () => {
        if(!code.trim()) return;
        setLoading(true);
        setError('');
        const data = await pullLiveRound(code.trim().toUpperCase());
        if(!data) {
          setError('Room not found. Check the code and try again.');
          setLoading(false);
          return;
        }
        setLiveData(data);
        setLoading(false);
        setMode('joined');
      };

      /* Live leaderboard: refresh every 15s while joined */
      React.useEffect(() => {
        if(mode !== 'joined') return;
        const iv = setInterval(async () => {
          try {
            const d = await pullLiveRound(code.trim().toUpperCase());
            if(d) setLiveData(d);
          } catch(e) {}
        }, 15000);
        return () => clearInterval(iv);
      }, [mode]);

      return (
        <div style={{minHeight:"100vh",backgroundImage:"var(--cc-bg)",backgroundSize:"cover",backgroundPosition:"center",padding:"20px 16px 30px",color:"#fff",fontFamily:"Georgia,serif"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
            <div><div style={{fontSize:22,fontWeight:900,letterSpacing:-1}}>Card Caddie</div><div style={{fontSize:10,color:"#86efac"}}>🔗 Live Round</div></div>
            <button onClick={onBack} style={{background:"rgba(0,0,0,0.4)",border:"1px solid rgba(255,255,255,0.2)",borderRadius:8,color:"#fff",padding:"6px 12px",fontSize:11,cursor:"pointer",fontFamily:"Georgia,serif"}}>Back</button>
          </div>

          {/* Animated live indicator */}
          <div style={{textAlign:"center",marginBottom:20}}>
            <div style={{position:"relative",width:100,height:100,margin:"0 auto 12px"}}>
              <svg width="100" height="100" style={{animation:"spin 8s linear infinite",display:"block"}}>
                <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(134,239,172,0.3)" strokeWidth="2" strokeDasharray="8,4"/>
                <circle cx="50" cy="50" r="35" fill="none" stroke="rgba(134,239,172,0.15)" strokeWidth="1.5" strokeDasharray="5,6"/>
              </svg>
              <div style={{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",textAlign:"center"}}>
                <img src={LOGO_ICON} alt="CC" style={{width:40,height:40,objectFit:"contain"}}/>
              </div>
            </div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
              <div style={{width:8,height:8,borderRadius:"50%",background:"#22c55e",animation:"pulse 1.5s ease-in-out infinite"}}/>
              <div style={{fontSize:12,color:"#86efac",fontWeight:700,letterSpacing:1}}>LIVE</div>
            </div>
          </div>
          <div style={{fontSize:13,color:"rgba(255,255,255,0.7)",lineHeight:1.6,marginBottom:20,background:"rgba(10,61,31,0.85)",borderRadius:14,padding:16}}>
            Play a round with mates on separate phones — everyone scores their own holes and the leaderboard updates live for the whole group. 📱⛳
          </div>

          {!mode && (
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              <button onClick={createRoom} style={{padding:"16px",borderRadius:14,border:"1.5px solid #86efac",background:"rgba(134,239,172,0.1)",color:"#86efac",fontSize:15,fontWeight:800,cursor:"pointer",fontFamily:"Georgia,serif"}}>
                ➕ Create a Room
              </button>
              <button onClick={()=>setMode('join')} style={{padding:"16px",borderRadius:14,border:"1.5px solid rgba(255,255,255,0.2)",background:"rgba(255,255,255,0.05)",color:"#fff",fontSize:15,fontWeight:800,cursor:"pointer",fontFamily:"Georgia,serif"}}>
                🔗 Join a Room
              </button>
            </div>
          )}

          {mode==='created' && (
            <div style={{textAlign:"center"}}>
              <div style={{background:"rgba(10,61,31,0.85)",borderRadius:14,padding:24,marginBottom:14}}>
                <div style={{fontSize:11,color:"#86efac",letterSpacing:2,marginBottom:10}}>YOUR ROOM CODE</div>
                <div style={{fontSize:52,fontWeight:900,letterSpacing:8,color:"#fff",marginBottom:10}}>{code}</div>
                <div style={{fontSize:12,color:"rgba(255,255,255,0.5)"}}>Share this code with your playing partners</div>
              </div>
              <button onClick={()=>{try{localStorage.setItem('cc_live_code',code);}catch(e){} onStartLive(code);}} style={{width:"100%",padding:"14px",borderRadius:12,border:"none",background:"linear-gradient(135deg,#16a34a,#22c55e)",color:"#fff",fontSize:15,fontWeight:800,cursor:"pointer",fontFamily:"Georgia,serif"}}>
                ⛳ Set Up the Round
              </button>
            </div>
          )}

          {mode==='join' && (
            <div>
              <div style={{background:"rgba(10,61,31,0.85)",borderRadius:14,padding:16,marginBottom:14}}>
                <div style={{fontSize:11,color:"#86efac",letterSpacing:1,marginBottom:10}}>ENTER ROOM CODE</div>
                <input value={code} onChange={e=>setCode(e.target.value.toUpperCase())} placeholder="e.g. AB3X" maxLength={4}
                  style={{width:"100%",padding:"14px",borderRadius:10,border:"1px solid rgba(255,255,255,0.2)",background:"rgba(255,255,255,0.08)",color:"#fff",fontSize:28,fontWeight:900,outline:"none",fontFamily:"Georgia,serif",textAlign:"center",letterSpacing:6,boxSizing:"border-box"}} />
                {error && <div style={{fontSize:12,color:"#f87171",marginTop:8,textAlign:"center"}}>{error}</div>}
              </div>
              <button onClick={joinRoom} disabled={loading||code.length<4} style={{width:"100%",padding:"14px",borderRadius:12,border:"none",background:code.length>=4?"linear-gradient(135deg,#16a34a,#22c55e)":"rgba(255,255,255,0.1)",color:"#fff",fontSize:15,fontWeight:800,cursor:code.length>=4?"pointer":"default",fontFamily:"Georgia,serif"}}>
                {loading?"Joining...":"Join Room"}
              </button>
            </div>
          )}

          {mode==='joined' && liveData && (() => {
            const gs = liveData.game_state || {};
            const rPlayers = gs.players || [];
            const rScores = liveData.scores || [];
            const ck = gs.courseKey;
            const holes = (ck && COURSES[ck]) ? COURSES[ck].holes : null;
            const isStb = gs.format === 'stableford' || gs.format === 'tournament';
            const rows = rPlayers.map((p, pi) => {
              const ps = rScores[pi] || [];
              const thru = ps.filter(s => s !== "" && s != null).length;
              const gross = ps.reduce((s,v) => s + (parseInt(v)||0), 0);
              let pts = 0;
              if (isStb && holes) {
                holes.forEach((h,hi) => {
                  const v = ps[hi];
                  if (v === "" || v == null) return;
                  pts += stablefordPts(v, h.par, shotsReceived(h.si, p.handicap, gs.nineHoles)) || 0;
                });
              }
              return { name: p.name, handicap: p.handicap, thru, gross, pts };
            }).sort((a,b) => isStb ? b.pts - a.pts : ((a.thru?a.gross:9999) - (b.thru?b.gross:9999)));
            const stale = rPlayers.length === 0;
            return (
              <div style={{background:"rgba(10,61,31,0.85)",borderRadius:14,padding:16}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
                  <div style={{width:8,height:8,borderRadius:"50%",background:"#22c55e",animation:"pulse 1.5s ease-in-out infinite"}}/>
                  <div style={{fontSize:11,color:"#86efac",letterSpacing:1,fontWeight:700}}>LIVE LEADERBOARD · ROOM {code}</div>
                </div>
                <div style={{fontSize:16,fontWeight:700,marginBottom:4}}>{gs.course}</div>
                <div style={{fontSize:12,color:"rgba(255,255,255,0.5)",marginBottom:14}}>{gs.format}{stale?"":" · updates automatically"}</div>
                {stale ? (
                  <div style={{fontSize:13,color:"rgba(255,255,255,0.6)",textAlign:"center",padding:"18px 0"}}>⛳ Waiting for the host to start the round…</div>
                ) : (<React.Fragment>
                {rows.map((r,i) => (
                  <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:"1px solid rgba(255,255,255,0.08)"}}>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <div style={{fontSize:13,fontWeight:900,color:i===0?"#fbbf24":"rgba(255,255,255,0.4)",width:20}}>{i+1}</div>
                      <div>
                        <div style={{color:PLAYER_COLORS[i%4],fontWeight:700,fontSize:14}}>{r.name}</div>
                        <div style={{fontSize:10,color:"rgba(255,255,255,0.4)"}}>Hdcp {r.handicap} · thru {r.thru}</div>
                      </div>
                    </div>
                    <div style={{textAlign:"right"}}>
                      <div style={{fontSize:18,fontWeight:900,color:"#86efac"}}>{isStb ? r.pts+" pts" : (r.thru ? r.gross : "—")}</div>
                      <div style={{fontSize:10,color:"rgba(255,255,255,0.4)"}}>{isStb ? (r.thru>0 ? r.gross+" gross" : "") : "gross"}</div>
                    </div>
                  </div>
                ))}

                {/* Hole-by-hole mini card */}
                {holes && (
                  <div style={{marginTop:14,overflowX:"auto"}}>
                    <div style={{fontSize:10,color:"rgba(255,255,255,0.4)",letterSpacing:1,marginBottom:6}}>HOLE BY HOLE</div>
                    <table style={{borderCollapse:"collapse",fontSize:11,whiteSpace:"nowrap"}}>
                      <thead>
                        <tr>
                          <td style={{padding:"3px 6px",color:"rgba(255,255,255,0.4)",fontWeight:700}}>Hole</td>
                          {holes.map(h => <td key={h.hole} style={{padding:"3px 5px",color:"rgba(255,255,255,0.5)",fontWeight:700,textAlign:"center"}}>{h.hole}</td>)}
                        </tr>
                        <tr>
                          <td style={{padding:"3px 6px",color:"rgba(255,255,255,0.3)"}}>Par</td>
                          {holes.map(h => <td key={h.hole} style={{padding:"3px 5px",color:"rgba(255,255,255,0.35)",textAlign:"center"}}>{h.par}</td>)}
                        </tr>
                      </thead>
                      <tbody>
                        {rPlayers.map((p,pi) => (
                          <tr key={pi}>
                            <td style={{padding:"3px 6px",color:PLAYER_COLORS[pi%4],fontWeight:700}}>{(p.name||"").split(" ")[0]}</td>
                            {holes.map((h,hi) => {
                              const v = (rScores[pi]||[])[hi];
                              const has = v !== "" && v != null;
                              const diff = has ? (parseInt(v)-h.par) : 0;
                              return <td key={hi} style={{padding:"3px 5px",textAlign:"center",fontWeight:700,
                                color: !has ? "rgba(255,255,255,0.15)" : diff<0 ? "#86efac" : diff===0 ? "#fff" : diff===1 ? "#fbbf24" : "#f87171"
                              }}>{has ? v : "·"}</td>;
                            })}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
                {liveData.updated_at && (
                  <div style={{fontSize:10,color:"rgba(255,255,255,0.35)",textAlign:"center",marginTop:10}}>
                    Last score {new Date(liveData.updated_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}
                  </div>
                )}
                </React.Fragment>)}
                <div style={{fontSize:10,color:"rgba(255,255,255,0.35)",textAlign:"center",marginTop:12}}>Refreshes every 15 seconds · keep this screen open</div>
              </div>
            );
          })()}
        </div>
      );
    }

    // ── BEERS OWED SCREEN ─────────────────────────────────────────────────────
    function BeersScreen({ onBack }) {
      const [beers, setBeers] = React.useState(loadBeers);
      const names = Object.keys(beers).filter(n => beers[n] > 0);
      const allNames = Object.keys(beers);
      const settle = (name) => { const u={...beers,[name]:0}; setBeers(u); saveBeers(u); };
      const settleAll = () => { const c=Object.fromEntries(Object.keys(beers).map(k=>[k,0])); setBeers(c); saveBeers(c); };
      const totalBeers = Object.values(beers).reduce((s,v)=>s+v,0);

      return (

    // ── SCORE TREND SCREEN ────────────────────────────────────────────────────
    function TrendScreen({ onBack }) {
      const history = loadHistory();
      const [selectedPlayer, setSelectedPlayer] = React.useState(null);
      const allPlayers = [...new Set(history.flatMap(r=>r.players.map(p=>p.name)))];
      const active = selectedPlayer || allPlayers[0] || null;

      const playerRounds = history
        .filter(r => r.players.some(p=>p.name===active))
        .slice(0,10).reverse()
        .map(r => {
          const p = r.players.find(p=>p.name===active);
          const isStable = r.format==="stableford"||r.format==="tournament";
          const words = r.course.split(" ");
          return { date:r.date, label:words[words.length-1].slice(0,6), val:isStable?p.pts:p.gross, isStable };
        });

      const vals = playerRounds.map(r=>r.val).filter(Boolean);
      const W=300, H=130, pad=28;
      const minV = vals.length ? Math.min(...vals)-2 : 0;
      const maxV = vals.length ? Math.max(...vals)+2 : 40;
      const range = maxV - minV || 1;
      const xStep = playerRounds.length > 1 ? (W-pad*2)/(playerRounds.length-1) : 0;
      const pts = playerRounds.map((r,i) => ({
        x: pad + i*xStep,
        y: H - pad - ((r.val-minV)/range)*(H-pad*2),
        ...r
      }));
      const pathParts = pts.map((p,i) => (i===0?"M":"L") + p.x.toFixed(1) + "," + p.y.toFixed(1));
      const pathD = pathParts.join(" ");

      return (
        <div style={{minHeight:"100vh",backgroundImage:`url(${BG_PHOTO})`,backgroundSize:"cover",backgroundPosition:"center",padding:"20px 16px 30px",color:"#fff",fontFamily:"Georgia,serif"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
            <div><div style={{fontSize:24,fontWeight:900,letterSpacing:-1}}>Card Caddie</div><div style={{fontSize:11,color:"#86efac"}}>📈 Score Trends</div></div>
            <button onClick={onBack} style={{background:"rgba(0,0,0,0.4)",border:"1px solid rgba(255,255,255,0.2)",borderRadius:8,color:"#fff",padding:"6px 12px",fontSize:11,cursor:"pointer",fontFamily:"Georgia,serif"}}>Back</button>
          </div>

          {allPlayers.length===0 ? (
            <div style={{textAlign:"center",padding:"60px 20px",color:"rgba(255,255,255,0.5)"}}>
              <div style={{fontSize:48,marginBottom:16}}>📈</div>
              <div style={{fontSize:16}}>No rounds saved yet</div>
            </div>
          ) : (
            <div>
              <div style={{display:"flex",gap:6,marginBottom:16,flexWrap:"wrap"}}>
                {allPlayers.map((name,i) => (
                  <button key={name} onClick={()=>setSelectedPlayer(name)} style={{padding:"7px 14px",borderRadius:20,border:"2px solid "+(active===name?PLAYER_COLORS[i%4]:"rgba(255,255,255,0.15)"),background:active===name?PLAYER_COLORS[i%4]+"22":"transparent",color:active===name?PLAYER_COLORS[i%4]:"rgba(255,255,255,0.5)",fontWeight:700,fontSize:12,cursor:"pointer",fontFamily:"Georgia,serif"}}>{name}</button>
                ))}
              </div>

              {playerRounds.length < 2 ? (
                <div style={{background:"rgba(10,61,31,0.85)",borderRadius:14,padding:20,textAlign:"center",color:"rgba(255,255,255,0.5)"}}>Play at least 2 rounds to see your trend</div>
              ) : (
                <div style={{background:"rgba(10,61,31,0.85)",borderRadius:14,padding:16,marginBottom:14}}>
                  <div style={{fontSize:11,color:"#86efac",letterSpacing:1,marginBottom:12}}>LAST {playerRounds.length} ROUNDS</div>
                  <svg width="100%" viewBox={"0 0 "+W+" "+H} style={{overflow:"visible"}}>
                    {[0,1,2,3].map(i => {
                      const y = pad + i*(H-pad*2)/3;
                      const v = Math.round(maxV - i*range/3);
                      return (
                        <g key={i}>
                          <line x1={pad} y1={y} x2={W-pad} y2={y} stroke="rgba(255,255,255,0.1)" strokeWidth="1"/>
                          <text x={pad-4} y={y+4} fill="rgba(255,255,255,0.4)" fontSize="9" textAnchor="end">{v}</text>
                        </g>
                      );
                    })}
                    <path d={pathD} fill="none" stroke="#22c55e" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
                    {pts.map((p,i) => (
                      <g key={i}>
                        <circle cx={p.x} cy={p.y} r="5" fill="#22c55e" stroke="#fff" strokeWidth="1.5"/>
                        <text x={p.x} y={H-4} fill="rgba(255,255,255,0.5)" fontSize="8" textAnchor="middle">{p.label}</text>
                        <text x={p.x} y={p.y-9} fill="#fff" fontSize="10" textAnchor="middle" fontWeight="bold">{p.val}</text>
                      </g>
                    ))}
                  </svg>
                </div>
              )}

              {vals.length > 0 && (
                <div style={{display:"flex",gap:8}}>
                  {[
                    ["Best", playerRounds[0].isStable?Math.max(...vals):Math.min(...vals)],
                    ["Latest", playerRounds[playerRounds.length-1].val||"—"],
                    ["Rounds", playerRounds.length],
                  ].map(([label,val]) => (
                    <div key={label} style={{flex:1,background:"rgba(10,61,31,0.85)",borderRadius:10,padding:"12px 8px",textAlign:"center"}}>
                      <div style={{fontSize:22,fontWeight:900,color:"#86efac"}}>{val}</div>
                      <div style={{fontSize:10,color:"rgba(255,255,255,0.5)"}}>{label.toUpperCase()}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ── ROUND SUMMARY STATS COMPONENT ─────────────────────────────────────────
    function RoundSummaryStats({ scores, course, players, format, nineHoles }) {
      return (
        <div style={{marginTop:16}}>
          <div style={{fontSize:11,color:"#86efac",letterSpacing:1,marginBottom:10}}>ROUND BREAKDOWN</div>
          {players.map((p,pi) => {
            const hs = scores[pi];
            const birdies = hs.filter((s,i)=>s&&parseInt(s)<course.holes[i].par).length;
            const pars    = hs.filter((s,i)=>s&&parseInt(s)===course.holes[i].par).length;
            const bogeys  = hs.filter((s,i)=>s&&parseInt(s)===course.holes[i].par+1).length;
            const doubles = hs.filter((s,i)=>s&&parseInt(s)===course.holes[i].par+2).length;
            const others  = hs.filter((s,i)=>s&&parseInt(s)>course.holes[i].par+2).length;
            const played  = hs.filter(s=>s).length;
            if(played===0) return null;
            return (
              <div key={pi} style={{background:"rgba(10,61,31,0.85)",borderRadius:12,padding:14,marginBottom:10}}>

    function CoursOfTheDay({ setCourseKey }) {
      const courseKeys = Object.keys(COURSES).filter(k => k !== 'generic');
      const dayOfYear = Math.floor((Date.now() - new Date(new Date().getFullYear(),0,0)) / 86400000);
      const todayKey = courseKeys[dayOfYear % courseKeys.length];
      const todayCourse = COURSES[todayKey];
      const holes = todayCourse.holes || [];
      const totalPar = holes.reduce((s,h)=>s+h.par, 0);
      const par3s = holes.filter(h=>h.par===3).length;
      const par4s = holes.filter(h=>h.par===4).length;
      const par5s = holes.filter(h=>h.par===5).length;
      return (
        <div style={{flex:1,borderRadius:14,overflow:"hidden",border:"1px solid rgba(251,191,36,0.4)",display:"flex",flexDirection:"column",minHeight:140}}>
          <div style={{background:"rgba(0,0,0,0.35)",backdropFilter:"blur(8px)",WebkitBackdropFilter:"blur(8px)",padding:"8px 10px",borderBottom:"1.5px solid #fbbf24"}}>
            <div style={{fontSize:8,color:"#fbbf24",letterSpacing:1.5,fontWeight:700,marginBottom:2}}>⛳ COURSE OF THE DAY</div>
            <div style={{fontSize:12,fontWeight:900,color:"#fff",lineHeight:1.2}}>{todayCourse.name}</div>
          </div>
          <div style={{background:"rgba(255,255,255,0.12)",backdropFilter:"blur(10px)",WebkitBackdropFilter:"blur(10px)",padding:"10px",flex:1,display:"flex",flexDirection:"column",justifyContent:"space-between"}}>
            <div style={{marginBottom:8}}>
              <div style={{display:"flex",justifyContent:"center",marginBottom:6}}>
                <div style={{textAlign:"center",background:"rgba(255,255,255,0.06)",borderRadius:8,padding:"4px 12px"}}>
                  <div style={{fontSize:18,fontWeight:900,color:"#fff",lineHeight:1}}>{totalPar||72}</div>
                  <div style={{fontSize:8,color:"rgba(255,255,255,0.4)"}}>TOTAL PAR</div>
                </div>
              </div>
              <div style={{display:"flex",justifyContent:"space-between",gap:4}}>
                {[[par3s,"Par 3","#60a5fa"],[par4s,"Par 4","#86efac"],[par5s,"Par 5","#fbbf24"]].map(([n,l,c])=>(
                  <div key={l} style={{flex:1,textAlign:"center",background:"rgba(255,255,255,0.04)",borderRadius:6,padding:"4px 2px"}}>
                    <div style={{fontSize:13,fontWeight:700,color:c}}>{n}</div>
                    <div style={{fontSize:7,color:"rgba(255,255,255,0.4)"}}>{l}s</div>
                  </div>
                ))}
              </div>
            </div>
            <button onClick={()=>setCourseKey(todayKey)} style={{width:"100%",padding:"7px",borderRadius:8,border:"none",background:"linear-gradient(135deg,#ca8a04,#fbbf24)",color:"#000",fontSize:11,fontWeight:800,cursor:"pointer",fontFamily:"Georgia,serif"}}>
              Play Here ⛳
            </button>
          </div>
        </div>
      );
    }

    function MilestonePopup({ milestones, onClose }) {
      const [idx, setIdx] = React.useState(0);
      if(!milestones||milestones.length===0) return null;
      const m = milestones[idx];
      const next = () => { if(idx<milestones.length-1) setIdx(idx+1); else onClose(); };
      return (
        <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.85)",zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <div style={{background:"linear-gradient(135deg,#0a3d1f,#166534)",borderRadius:20,padding:30,maxWidth:340,width:"100%",textAlign:"center",border:"2px solid #86efac"}}>
            <div style={{fontSize:52,marginBottom:12}}>{m.icon}</div>
            <div style={{fontSize:11,color:"#86efac",letterSpacing:2,marginBottom:6}}>MILESTONE</div>
            <div style={{fontSize:22,fontWeight:900,color:"#fff",marginBottom:8}}>{m.title}</div>
            <div style={{fontSize:14,color:"rgba(255,255,255,0.7)",marginBottom:24,lineHeight:1.5}}>{m.desc}</div>
            <button onClick={next} style={{width:"100%",padding:"14px",borderRadius:12,border:"none",background:"linear-gradient(135deg,#16a34a,#22c55e)",color:"#fff",fontSize:15,fontWeight:800,cursor:"pointer",fontFamily:"Georgia,serif"}}>
              {idx<milestones.length-1?"Next 🎉":"Nice one! 🍺"}
            </button>
          </div>
        </div>
      );
    }

    function SetupScreen({ onStart, pausedGame, onReturnToRound, onShowHistory, onShowBeers, onShowTrend, onShowForfeit, onShowPlayerId, onShowLiveRound, onShowGolfSchool, feedbackName, setFeedbackName, feedbackType, setFeedbackType, feedbackMsg, setFeedbackMsg, feedbackSent, feedbackSending, submitFeedback }) {
      const [courseKey, setCourseKey] = useState("");
      const [format, setFormat] = useState("stableford");
      const [numPlayers, setNumPlayers] = useState(1);
      const [players, setPlayers] = useState([{name:"",handicap:""},{name:"",handicap:""},{name:"",handicap:""},{name:"",handicap:""}]);
      const [nineHoles, setNineHoles] = useState(false);
      const [frontNine, setFrontNine] = useState(true);
      const [showInfo, setShowInfo] = useState(false);
      const [showMenu, setShowMenu] = useState(false);
      const [showFeedback, setShowFeedback] = useState(false);

      const activePlayers = players.slice(0, numPlayers);
      const canStart = courseKey !== "" && activePlayers.every(p => p.name.trim() && p.handicap !== "")
        && (format !== "matchplay" || numPlayers === 2);

      const handleStart = () => {
        if (!courseKey) return;
        activePlayers.forEach(p => savePlayerName(p.name));
        const course = COURSES[courseKey];
        const allHoles = course.holes;
        const playedHoles = nineHoles ? (frontNine ? allHoles.slice(0,9) : allHoles.slice(9,18)) : allHoles;
        const isAmbrose = format==="ambrose";
        const isTournament = format==="tournament";
        onStart({
          players: activePlayers.map(p => ({ name:p.name.trim(), handicap:parseFloat(p.handicap)||0 })),
          course: { ...course, holes: playedHoles },
          courseKey,
          format,
          ambroseFormat: isAmbrose ? "stableford" : null,
          nineHoles,
          tournamentCode: isTournament ? Math.random().toString(36).substring(2,6).toUpperCase() : null,
          groupName: "Group 1",
          tournMode: "create",
          tournType: "individual",
          ldHoles: [], ctpHoles: [],
        });
      };

      return (
        <div style={{minHeight:"100vh",backgroundImage:`url(${BG_PHOTO})`,backgroundSize:"cover",backgroundPosition:"center",backgroundRepeat:"no-repeat",backgroundAttachment:"fixed",padding:"14px 14px 30px",color:"#fff",fontFamily:"Georgia,serif"}}>

          {/* Header */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <img src={LOGO_FULL} alt="Card Caddie" style={{height:50,objectFit:"contain"}} />
            <div style={{display:"flex",gap:6,alignItems:"center"}}>
              {[
                {fn:()=>setShowInfo(true), label:"ⓘ"},
                {fn:()=>setShowFeedback(true), label:"💬"},
                {fn:()=>setShowMenu(true), label:"≡"},
              ].map(({fn,label},i) => (
                <button key={i} onClick={fn} style={{
                  width:44,height:44,display:"flex",alignItems:"center",justifyContent:"center",
                  background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.15)",
                  borderRadius:10,color:"rgba(255,255,255,0.8)",fontSize:18,cursor:"pointer",
                  fontFamily:"Georgia,serif",lineHeight:1,flexShrink:0,
                }}>{label}</button>
              ))}
            </div>
          </div>

          <div style={{width:"100%",maxWidth:440}}>

            {/* Haven't played nudge */}
            {(() => {
              const hist = loadHistory();
              if(hist.length===0) return null;
              const last = new Date(hist[0].id);
              const daysSince = Math.floor((Date.now() - last) / 86400000);
              if(daysSince < 7) return null;
              return (
                <div style={{background:"rgba(251,191,36,0.15)",backdropFilter:"blur(10px)",WebkitBackdropFilter:"blur(10px)",border:"1px solid rgba(251,191,36,0.4)",borderRadius:12,padding:"10px 14px",marginBottom:10,display:"flex",alignItems:"center",gap:10}}>
                  <span style={{fontSize:20}}>⛳</span>
                  <div>
                    <div style={{fontSize:12,fontWeight:700,color:"#fbbf24"}}>Time for a round!</div>
                    <div style={{fontSize:11,color:"rgba(255,255,255,0.5)"}}>You haven't played in {daysSince} days</div>
                  </div>
                </div>
              );
            })()}

            {/* Three cards */}
            <div style={{display:"flex",gap:8,marginBottom:10}}>
              <HomeScreenTip />
              <WeatherCard />
              <CoursOfTheDay setCourseKey={setCourseKey} />
            </div>

            {/* Return to Round banner */}
            {pausedGame && (
              <div onClick={onReturnToRound} style={{background:"linear-gradient(135deg,rgba(34,197,94,0.25),rgba(22,163,74,0.2))",border:"1.5px solid #22c55e",borderRadius:14,padding:"12px 16px",marginBottom:10,display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}}>
                <div>
                  <div style={{fontSize:11,color:"#22c55e",fontWeight:700,letterSpacing:1,marginBottom:2}}>🏌️ ROUND IN PROGRESS</div>
                  <div style={{fontSize:13,color:"#fff",fontWeight:700}}>{pausedGame.course.name}</div>
                  <div style={{fontSize:11,color:"rgba(255,255,255,0.5)"}}>{pausedGame.players.map(p=>p.name).join(", ")}</div>
                </div>
                <div style={{background:"#22c55e",borderRadius:10,padding:"8px 14px",color:"#000",fontSize:12,fontWeight:800,fontFamily:"Georgia,serif"}}>Return ›</div>
              </div>
            )}

            {/* Last round glance */}
            {(() => {
              const hist = loadHistory();
              if(!hist||hist.length===0) return null;
              const last = hist[0];
              return (
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 14px",background:"rgba(255,255,255,0.1)",backdropFilter:"blur(10px)",WebkitBackdropFilter:"blur(10px)",borderRadius:12,border:"1px solid rgba(255,255,255,0.2)",marginBottom:10}}>
                  <div>
                    <div style={{fontSize:9,color:"rgba(255,255,255,0.4)",letterSpacing:1}}>LAST ROUND</div>
                    <div style={{fontSize:12,fontWeight:700,color:"#fff"}}>{last.course}</div>
                    <div style={{fontSize:10,color:"rgba(255,255,255,0.5)"}}>{last.date}</div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    {last.players&&last.players[0]&&last.players[0].pts!=null&&<div style={{fontSize:18,fontWeight:900,color:"#fbbf24"}}>{last.players[0].pts} pts</div>}
                    {last.winner&&<div style={{fontSize:10,color:"#86efac"}}>🏆 {last.winner}</div>}
                  </div>
                </div>
              );
            })()}

            {/* Course selector */}
            <Section label="COURSE" icon="📍">
              <CourseSelector courseKey={courseKey} setCourseKey={setCourseKey} />
            </Section>

            {/* Format */}
            <Section label="FORMAT" icon="🏌️">
              <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
                {FORMATS.map(f => (
                  <button key={f} onClick={()=>setFormat(f)} style={{
                    padding:"7px 10px",borderRadius:10,border:"1.5px solid "+(format===f?"#86efac":"rgba(255,255,255,0.12)"),
                    background:format===f?"rgba(134,239,172,0.15)":"transparent",
                    color:format===f?"#86efac":"rgba(255,255,255,0.5)",
                    fontWeight:700,fontSize:11,cursor:"pointer",fontFamily:"Georgia,serif",
                  }}>{FORMAT_LABELS[f]}</button>
                ))}
              </div>
              <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",fontStyle:"italic"}}>{FORMAT_DESC[format]}</div>
            </Section>

            {/* Holes */}
            <Section label="HOLES" icon="🕳️">
              <div style={{display:"flex",gap:6}}>
                {[
                  {val:"18", label:"18 Holes", nine:false, front:false},
                  {val:"F9", label:"Front 9", nine:true, front:true},
                  {val:"B9", label:"Back 9", nine:true, front:false},
                ].map(opt => {
                  const isSelected = !nineHoles && !opt.nine ? true :
                    nineHoles && opt.nine && (opt.front ? frontNine : !frontNine) ? true : false;
                  return (
                    <button key={opt.val} onClick={()=>{setNineHoles(opt.nine);setFrontNine(opt.front);}} style={{
                      flex:1,padding:"10px 6px",borderRadius:10,border:"1.5px solid "+(isSelected?"#86efac":"rgba(255,255,255,0.12)"),
                      background:isSelected?"rgba(134,239,172,0.15)":"transparent",
                      color:isSelected?"#86efac":"rgba(255,255,255,0.5)",
                      fontWeight:700,fontSize:12,cursor:"pointer",fontFamily:"Georgia,serif",
                    }}>{opt.label}</button>
                  );
                })}
              </div>
            </Section>

            {/* Number of players */}
            <Section label={(format==="ambrose"||format==="tournament")?"TEAM MEMBERS":"NUMBER OF PLAYERS"} icon="👥">
              <div style={{display:"flex",gap:8}}>
                {(format==="matchplay"?[2]:[1,2,3,4]).map(n => (
                  <button key={n} onClick={()=>setNumPlayers(n)} style={{
                    flex:1,padding:"10px",borderRadius:10,border:"1.5px solid "+(numPlayers===n?"#86efac":"rgba(255,255,255,0.12)"),
                    background:numPlayers===n?"rgba(134,239,172,0.15)":"transparent",
                    color:numPlayers===n?"#86efac":"rgba(255,255,255,0.5)",
                    fontWeight:800,fontSize:16,cursor:"pointer",fontFamily:"Georgia,serif",
                  }}>{n}</button>
                ))}
              </div>
            </Section>

            {/* Player details */}
            <Section label={(format==="ambrose"||format==="tournament")?"TEAM MEMBER DETAILS":format==="matchplay"?"PLAYER DETAILS (1v1)":"PLAYER DETAILS"} icon="🏌️">
              {activePlayers.map((p,i) => (
                <div key={i} style={{display:"flex",gap:8,marginBottom:8,alignItems:"center"}}>
                  <div style={{width:28,height:28,borderRadius:"50%",background:PLAYER_BG[i],border:"1px solid "+PLAYER_COLORS[i],display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,color:PLAYER_COLORS[i],flexShrink:0}}>{i+1}</div>
                  <div style={{flex:2,position:"relative"}}>
                    <input value={p.name} onChange={e=>{const u=[...players];u[i]={...u[i],name:e.target.value};setPlayers(u);}} placeholder={`Player ${i+1} name`}
                      style={{width:"100%",padding:"9px 12px",borderRadius:10,border:"1px solid rgba(255,255,255,0.15)",background:"rgba(255,255,255,0.08)",color:"#fff",fontSize:13,outline:"none",fontFamily:"Georgia,serif",boxSizing:"border-box"}} />
                    {!p.name && loadPlayerNames().length>0 && (
                      <div style={{display:"flex",gap:4,flexWrap:"wrap",marginTop:4}}>
                        {loadPlayerNames().slice(0,4).map(name => (
                          <button key={name} onClick={()=>{const u=[...players];u[i]={...u[i],name};setPlayers(u);}} style={{
                            padding:"3px 8px",borderRadius:6,border:"1px solid rgba(134,239,172,0.3)",
                            background:"rgba(134,239,172,0.08)",color:"#86efac",fontSize:10,
                            cursor:"pointer",fontFamily:"Georgia,serif",
                          }}>{name}</button>
                        ))}
                      </div>
                    )}
                  </div>
                  <input type="number" inputMode="decimal" step="0.1" value={p.handicap} onChange={e=>{const u=[...players];u[i]={...u[i],handicap:e.target.value};setPlayers(u);}} placeholder="Hdcp" min="0" max="54"
                    style={{width:60,padding:"9px 8px",borderRadius:10,border:"1px solid rgba(255,255,255,0.15)",background:"rgba(255,255,255,0.08)",color:"#fff",fontSize:13,outline:"none",fontFamily:"Georgia,serif",textAlign:"center"}} />
                </div>
              ))}
            </Section>

            {/* Tee Off button */}
            <button onClick={handleStart} disabled={!canStart} style={{
              width:"100%",padding:"16px",borderRadius:14,border:"none",
              background:canStart?"linear-gradient(135deg,#16a34a,#22c55e)":"rgba(255,255,255,0.08)",
              color:canStart?"#fff":"rgba(255,255,255,0.2)",
              fontSize:17,fontWeight:900,cursor:canStart?"pointer":"default",
              fontFamily:"Georgia,serif",marginBottom:20,letterSpacing:0.5,
            }}>
              {canStart?"⛳ Tee Off!":"Fill in all details to start"}
            </button>

          </div>

          {/* Hamburger menu */}
          {showMenu && (
            <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.75)",zIndex:1000,display:"flex",justifyContent:"flex-end"}} onClick={() => setShowMenu(false)}>
              <div onClick={e=>e.stopPropagation()} style={{background:"linear-gradient(160deg,#0a2d18,#0f3d22)",width:"75%",maxWidth:280,height:"100%",padding:"50px 0 30px",display:"flex",flexDirection:"column",borderLeft:"1px solid rgba(134,239,172,0.2)"}}>
                <div style={{padding:"0 20px 20px",borderBottom:"1px solid rgba(255,255,255,0.08)",marginBottom:8}}>
                  <img src={LOGO_FULL} alt="Card Caddie" style={{height:36,objectFit:"contain"}} />
                </div>
                {[
                  {icon:"📋", label:"Round History",    action:()=>{setShowMenu(false);onShowHistory();}},
                  {icon:"📈", label:"Score Trends",     action:()=>{setShowMenu(false);onShowTrend();}},
                  {icon:"🍺", label:"The 19th Hole",       action:()=>{setShowMenu(false);onShowBeers();}},
                  {icon:"🎲", label:"Forfeit Golf",     action:()=>{setShowMenu(false);onShowForfeit();}},
                  {icon:"🔗", label:"Live Round",       action:()=>{setShowMenu(false);onShowLiveRound();}},
                  {icon:"🪪", label:"My Player ID",     action:()=>{setShowMenu(false);onShowPlayerId();}},
                  {icon:"📚", label:"Golf School",      action:()=>{setShowMenu(false);onShowGolfSchool();}},
                ].map((item,i) => (
                  <button key={i} onClick={item.action} style={{
                    display:"flex",alignItems:"center",gap:14,
                    padding:"14px 20px",background:"transparent",
                    border:"none",borderBottom:"1px solid rgba(255,255,255,0.05)",
                    color:"#fff",fontSize:14,fontWeight:600,cursor:"pointer",
                    fontFamily:"Georgia,serif",textAlign:"left",width:"100%",
                  }}>
                    <span style={{fontSize:20,width:28,textAlign:"center"}}>{item.icon}</span>
                    <span>{item.label}</span>
                  </button>
                ))}
                <div style={{marginTop:"auto",padding:"20px"}}>
                  <div style={{fontSize:10,color:"rgba(255,255,255,0.3)",textAlign:"center"}}>cardcaddie.netlify.app</div>
                </div>
              </div>
            </div>
          )}

          {/* Info modal */}
          {showInfo && (
            <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.85)",zIndex:1000,overflowY:"auto",padding:"20px 16px 40px"}}>
              <div style={{maxWidth:440,margin:"0 auto"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
                  <div style={{fontSize:20,fontWeight:900,color:"#fff"}}>How to use Card Caddie</div>
                  <button onClick={()=>setShowInfo(false)} style={{background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.2)",borderRadius:8,color:"#fff",padding:"6px 12px",fontSize:13,cursor:"pointer",fontFamily:"Georgia,serif"}}>✕</button>
                </div>
                <InfoSection title="🚀 GETTING STARTED">
                  <InfoRow icon="1️⃣" text="Check the weather strip and your last round at a glance on the home screen" />
                  <InfoRow icon="📱" text="Add Card Caddie to your home screen for one-tap access — tap Share then 'Add to Home Screen'" />
                  <InfoRow icon="2️⃣" text="Select your course — tap a region tile in the 2-column grid, then choose your course. Tap 🌐 to visit the club website." />
                  <InfoRow icon="3️⃣" text="Pick your format — Stableford is the most popular for casual golf" />
                  <InfoRow icon="4️⃣" text="Choose 18 Holes, Front 9 or Back 9" />
                  <InfoRow icon="5️⃣" text="Enter player names and handicaps — recently played names appear as quick-tap suggestions" />
                  <InfoRow icon="6️⃣" text="Tap Tee Off and start scoring hole by hole" />
                </InfoSection>
                <InfoSection title="⛳ DURING A ROUND">
                  <InfoRow icon="➕" text="Tap the score buttons to enter each player's gross score" />
                  <InfoRow icon="🔵" text="Dots below scores show Stableford points at a glance" />
                  <InfoRow icon="👆" text="Tap a player name to switch to their scoring view" />
                  <InfoRow icon="📊" text="The hole info card shows par, stroke index and difficulty" />
                  <InfoRow icon="📈" text="Live stats strip on the Board tab shows birdies, pars and bogeys as you play" />
                  <InfoRow icon="💰" text="Bet Tracker — tap 💰 to track side bets per hole" />
                  <InfoRow icon="📏" text="Smart Caddie — enter distance, set slope, lie, ball position and get a club recommendation with caddie notes. Wind and temperature adjust automatically." />
                  <InfoRow icon="🏠" text="Tap 🏠 to go home mid-round — your round is saved. Tap Return to Round to continue." />
                </InfoSection>
                <InfoSection title="🏆 AFTER THE ROUND">
                  <InfoRow icon="📤" text="Tap Share Results to save the round and share to your group chat" />
                  <InfoRow icon="🏅" text="Milestones and streaks pop up automatically after great rounds" />
                  <InfoRow icon="🍺" text="The 19th Hole — beers owed update automatically after each round. Loser buys the winner a beer!" />
                  <InfoRow icon="🍺" text="Enjoying Card Caddie? Head to The 19th Hole and buy Rick a beer — every one helps keep the app free!" />
                </InfoSection>
                <InfoSection title="📱 THE OTHER SCREENS">
                  <InfoRow icon="📋" text="History — past rounds with notes, personal bests, all-time board, handicap trend and achievement badges" />
                  <InfoRow icon="📈" text="Trends — score trend graph across your last 10 rounds" />
                  <InfoRow icon="🎲" text="Forfeit — lose a hole? Spin the wheel for a hilarious punishment" />
                  <InfoRow icon="📚" text="Golf School — tap ≡ then Golf School for bite-sized tips on shot shaping, short game, putting, course management, wind play and bunkers" />
                  <InfoRow icon="🏌️" text="Smart Caddie — tap the Tips tab for quick caddie advice on wind, slopes, lies and scoring smart" />
                  <InfoRow icon="🪪" text="My Player ID — your permanent Card Caddie identity for cloud sync" />
                </InfoSection>
                <InfoSection title="🔗 HOW TO USE LIVE ROUND">
                  <InfoRow icon="1️⃣" text="Tap ≡ then Live Round" />
                  <InfoRow icon="2️⃣" text="Tap Create a Room — you get a 4-digit code" />
                  <InfoRow icon="3️⃣" text="Share the code with your playing partners" />
                  <InfoRow icon="4️⃣" text="Each player opens Card Caddie, taps Live Round, then Join a Room and enters the code" />
                  <InfoRow icon="5️⃣" text="Set up the round normally — everyone scores their own holes and the leaderboard updates for the whole group in real time" />
                </InfoSection>
                <InfoSection title="🔗 LIVE & CLOUD">
                  <InfoRow icon="🪪" text="Tap 🪪 to see your Player ID — your unique Card Caddie identity that syncs your stats to the cloud" />
                  <InfoRow icon="🔗" text="Tap 🔗 to start or join a Live Round — play on separate phones, scores update for everyone in real time" />
                  <InfoRow icon="📊" text="Every saved round automatically syncs to the cloud — your stats are safe even if you switch phones" />
                  <InfoRow icon="🍺" text="Enjoying Card Caddie? Buy Rick a beer to keep it free!" />
                </InfoSection>
                <InfoSection title="🏌️ FORMATS EXPLAINED">
                  <InfoRow icon="⭐" text="Stableford — Points per hole based on handicap. 2pts = par, 3pts = birdie. Most popular casual format." />
                  <InfoRow icon="🏌️" text="Stroke Play — Total gross strokes. Lowest score wins. Pure scoring." />
                  <InfoRow icon="⚔️" text="Match Play — Win or lose each hole. 1v1 only. First to win more holes wins." />
                  <InfoRow icon="💰" text="Skins — Each hole is worth a skin. Ties carry the skin to the next hole." />
                  <InfoRow icon="🤝" text="Ambrose — Team format. Pick the best drive, everyone plays from there." />
                  <InfoRow icon="🏆" text="Tournament — Multiple groups, one shared leaderboard. Share a room code to link groups." />
                </InfoSection>
              </div>
            </div>
          )}

          {/* Feedback modal */}
          {showFeedback && (
            <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.85)",zIndex:1000,overflowY:"auto",padding:"20px 16px 40px"}}>
              <div style={{maxWidth:440,margin:"0 auto"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
                  <div style={{fontSize:20,fontWeight:900,color:"#fff"}}>💬 Feedback</div>
                  <button onClick={()=>setShowFeedback(false)} style={{background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.2)",borderRadius:8,color:"#fff",padding:"6px 12px",fontSize:13,cursor:"pointer",fontFamily:"Georgia,serif"}}>✕</button>
                </div>
                <div style={{background:"rgba(10,61,31,0.85)",borderRadius:16,padding:20,border:"1px solid rgba(134,239,172,0.2)"}}>
                  <div style={{fontSize:12,color:"rgba(255,255,255,0.7)",lineHeight:1.6,marginBottom:16}}>
                    Got a bug, an idea or a course to add? Fill in your name and message below — goes straight to the Card Caddie team!
                  </div>
                  <div style={{marginBottom:12}}>
                    <div style={{fontSize:11,color:"#86efac",letterSpacing:1,marginBottom:6}}>YOUR NAME <span style={{color:"#f87171"}}>*</span></div>
                    <input value={feedbackName} onChange={e => setFeedbackName(e.target.value)} placeholder="Rick"
                      style={{width:"100%",padding:"10px 12px",borderRadius:10,border:"1px solid rgba(255,255,255,0.2)",background:"rgba(255,255,255,0.08)",color:"#fff",fontSize:14,outline:"none",fontFamily:"Georgia,serif",boxSizing:"border-box"}} />
                  </div>
                  <div style={{marginBottom:12}}>
                    <div style={{fontSize:11,color:"#86efac",letterSpacing:1,marginBottom:6}}>TYPE</div>
                    <div style={{display:"flex",gap:6}}>
                      {["🐛 Bug","💡 Idea","⛳ Course Request","💬 Other"].map(type => (
                        <button key={type} onClick={() => setFeedbackType(type)} style={{
                          flex:1,padding:"8px 4px",borderRadius:8,fontSize:10,fontWeight:700,cursor:"pointer",fontFamily:"Georgia,serif",
                          border:"2px solid "+(feedbackType===type?"#86efac":"rgba(255,255,255,0.15)"),
                          background:feedbackType===type?"rgba(134,239,172,0.15)":"transparent",
                          color:feedbackType===type?"#86efac":"rgba(255,255,255,0.5)",
                        }}>{type}</button>
                      ))}
                    </div>
                  </div>
                  <div style={{marginBottom:16}}>
                    <div style={{fontSize:11,color:"#86efac",letterSpacing:1,marginBottom:6}}>MESSAGE</div>
                    <textarea value={feedbackMsg} onChange={e => setFeedbackMsg(e.target.value)} placeholder="Tell us what's on your mind..." rows={5}
                      style={{width:"100%",padding:"10px 12px",borderRadius:10,border:"1px solid rgba(255,255,255,0.2)",background:"rgba(255,255,255,0.08)",color:"#fff",fontSize:13,outline:"none",fontFamily:"Georgia,serif",resize:"none",boxSizing:"border-box"}} />
                  </div>
                  <button onClick={submitFeedback} disabled={!feedbackMsg.trim()||!feedbackName.trim()||feedbackSending} style={{
                    width:"100%",padding:"14px",borderRadius:12,border:"none",
                    background:feedbackMsg.trim()&&feedbackName.trim()?"linear-gradient(135deg,#16a34a,#22c55e)":"rgba(255,255,255,0.1)",
                    color:feedbackMsg.trim()&&feedbackName.trim()?"#fff":"rgba(255,255,255,0.3)",fontSize:15,fontWeight:800,
                    cursor:feedbackMsg.trim()&&feedbackName.trim()?"pointer":"default",fontFamily:"Georgia,serif",
                  }}>
                    {feedbackSending?"Sending...":"📤 Send Feedback"}
                  </button>
                  {feedbackSent && (
                    <div style={{textAlign:"center",marginTop:12,padding:12,background:"rgba(34,197,94,0.15)",borderRadius:10,border:"1px solid #22c55e"}}>
                      <div style={{fontSize:20,marginBottom:4}}>✅</div>
                      <div style={{fontSize:13,color:"#86efac",fontWeight:700}}>Feedback sent!</div>
                      <div style={{fontSize:11,color:"rgba(255,255,255,0.5)",marginTop:2}}>Thanks — we'll check it out</div>
                    </div>
                  )}
                  <div style={{textAlign:"center",marginTop:12,fontSize:10,color:"rgba(255,255,255,0.3)"}}>
                    Goes straight to cardcaddie@gmail.com
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    function App() {
  const [showSplash, setShowSplash] = React.useState(true);
 const [showSplash, setShowSplash] = useState(true);     
  const [gameState, setGameStateRaw] = useState(() => {
    try { return JSON.parse(localStorage.getItem('cc_game_live')) || null; } catch(e) { return null; }
  });
  const [pausedGame, setPausedGameRaw] = useState(() => {
    try { return JSON.parse(localStorage.getItem('cc_game_paused')) || null; } catch(e) { return null; }
  });
  const setGameState = (gs) => {
    setGameStateRaw(gs);
    try { gs ? localStorage.setItem('cc_game_live', JSON.stringify(gs)) : localStorage.removeItem('cc_game_live'); } catch(e) {}
  };
  const setPausedGame = (gs) => {
    setPausedGameRaw(gs);
    try { gs ? localStorage.setItem('cc_game_paused', JSON.stringify(gs)) : localStorage.removeItem('cc_game_paused'); } catch(e) {}
  };
  const [showHistory, setShowHistory] = useState(false);
  const [showBeers, setShowBeers] = useState(false);
  const [showBets, setShowBets] = useState(false);
  const [showTrend, setShowTrend] = useState(false);
  const [showDistance, setShowDistance] = useState(false);
  const [showForfeit, setShowForfeit] = useState(false);
  const [showGolfSchool, setShowGolfSchool] = useState(false);
  const [showPlayerId, setShowPlayerId] = useState(false);
  const [showLiveRound, setShowLiveRound] = useState(false);
  const [weatherData, setWeatherData] = useState(null);
  const [feedbackName, setFeedbackName] = useState("");
  const [feedbackType, setFeedbackType] = useState("");
  const [feedbackMsg, setFeedbackMsg] = useState("");
  const [feedbackSent, setFeedbackSent] = useState(false);
  const [feedbackSending, setFeedbackSending] = useState(false);

  const submitFeedback = async () => {
    if(!feedbackMsg.trim() || !feedbackName.trim()) return;
    setFeedbackSending(true);
    try {
      await emailjs.send("service_tj8jh33", "template_m8hy8pt", {
        from_name: feedbackName,
        feedback_type: feedbackType || "General",
        message: feedbackMsg,
      });
      setFeedbackSent(true);
      setFeedbackMsg(""); setFeedbackName(""); setFeedbackType("");
    } catch(e) {
      // Fallback to mailto
      const subject = encodeURIComponent("Card Caddie Feedback: " + (feedbackType||"General"));
      const body = encodeURIComponent("From: " + feedbackName + "\n\nType: " + (feedbackType||"General") + "\n\n" + feedbackMsg);
      window.open("mailto:cardcaddie@gmail.com?subject=" + subject + "&body=" + body);
      setFeedbackSent(true);
    }
    setFeedbackSending(false);
  };

  const handleRematch = (record) => {
    if (!record.courseKey || !COURSES[record.courseKey]) return;
    try{localStorage.removeItem('cc_round_autosave');}catch(e){}
    const allHoles = COURSES[record.courseKey].holes;
    const playedHoles = record.nineHoles ? allHoles.slice(0, record.holesCount) : allHoles;
    setShowHistory(false);
    setGameState({
      players: record.players.map(p => ({ name: p.name, handicap: p.handicap })),
      course: { ...COURSES[record.courseKey], holes: playedHoles },
      courseKey: record.courseKey,
      format: record.format,
      ambroseFormat: record.format === "ambrose" ? "stableford" : null,
      nineHoles: !!record.nineHoles,
      tournamentCode: null, groupName: "Group 1",
      tournMode: "create", tournType: "individual",
      ldHoles: [], ctpHoles: [],
    });
  };

  if (showSplash) return <SplashScreen onStart={() => setShowSplash(false)} />;
  if (showSplash) return <SplashScreen onStart={() => setShowSplash(false)} />;
  if (showBeers) return <BeersScreen onBack={() => setShowBeers(false)} />;
  if (showForfeit) return <ForfeitScreen onBack={() => setShowForfeit(false)} />;
  if (showGolfSchool) return <GolfSchoolScreen onBack={() => setShowGolfSchool(false)} />;
  if (showPlayerId) return <PlayerIdScreen onBack={() => setShowPlayerId(false)} />;
  if (showLiveRound) return <LiveRoundScreen onBack={() => setShowLiveRound(false)} onStartLive={(code,role,data) => {
    setShowLiveRound(false);
  }} />;
  if (showDistance) return <DistanceScreen onBack={() => setShowDistance(false)} windSpeed={weatherData?weatherData.wind:0} windDir={weatherData?weatherData.windDirStr:""} temp={weatherData?weatherData.temp:null} />;
  if (showBets) return <BetScreen onBack={() => setShowBets(false)} gameState={gameState} />;
  if (showTrend) return <TrendScreen onBack={() => setShowTrend(false)} />;
  if (showHistory) return <RoundHistoryScreen onBack={() => setShowHistory(false)} onRematch={handleRematch} />;
  return gameState
    ? <ScoringScreen gameState={gameState} onReset={() => { try{localStorage.removeItem('cc_round_autosave');}catch(e){} setPausedGame(null); setGameState(null); }} onPause={() => { setPausedGame(gameState); setGameState(null); }} onShowBets={() => setShowBets(true)} onShowDistance={() => setShowDistance(true)} />
    : <SetupScreen onStart={(gs) => { try{localStorage.removeItem('cc_round_autosave');}catch(e){} let lc=null; try{lc=localStorage.getItem('cc_live_code'); localStorage.removeItem('cc_live_code');}catch(e){} setPausedGame(null); setGameState(lc?{...gs,liveCode:lc}:gs); }} pausedGame={pausedGame} onReturnToRound={() => { setGameState(pausedGame); setPausedGame(null); }} onShowHistory={() => setShowHistory(true)} onShowBeers={() => setShowBeers(true)} onShowTrend={() => setShowTrend(true)} onShowForfeit={() => setShowForfeit(true)} onShowPlayerId={() => setShowPlayerId(true)} onShowLiveRound={() => setShowLiveRound(true)} onShowGolfSchool={() => setShowGolfSchool(true)} feedbackName={feedbackName} setFeedbackName={setFeedbackName} feedbackType={feedbackType} setFeedbackType={setFeedbackType} feedbackMsg={feedbackMsg} setFeedbackMsg={setFeedbackMsg} feedbackSent={feedbackSent} feedbackSending={feedbackSending} submitFeedback={submitFeedback} />;
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
