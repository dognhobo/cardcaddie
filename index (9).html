  <title>Card Caddie — Score smart. Play happy.</title>
  <script>
    if('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => {
            // Check for updates every time app loads
            reg.update();
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              newWorker.addEventListener('statechange', () => {
                if(newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // New version available — reload to get it
                  window.location.reload();
                }
              });
            });
          })
          .catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    #root { min-height: 100vh; min-height: -webkit-fill-available; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    button { font-family: Georgia, serif; }
    ::-webkit-scrollbar { display: none; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes firework { 0% { transform: scale(0); opacity: 1; } 50% { transform: scale(1.5); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }
  @keyframes fadeInUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

function shotsReceived(si, handicap, nineHoles) {
  const h = nineHoles ? Math.round((parseFloat(handicap)||0)/2) : Math.round(parseFloat(handicap)||0);
  if (h <= 0) return 0;
  if (h >= si) return 1 + (h - si >= 18 ? 1 : 0);
  return 0;
}

function stablefordPts(score, par, shots) {
  const s = parseInt(score);
  if (isNaN(s)) return null;
  const d = s - shots - par;
  if (d >= 2) return 0;
  if (d === 1) return 1;
  if (d === 0) return 2;
  if (d === -1) return 3;
  if (d === -2) return 4;
  return 5;
}

function windDir(deg) {
  const dirs = ["N","NE","E","SE","S","SW","W","NW"];
  return dirs[Math.round(deg/45)%8];
}

function WeatherCard() {
  const LOCATIONS = [
    { name:"Perth",       query:"Perth+Western+Australia",       lat:-31.95, lon:115.86 },
    { name:"Rockingham",  query:"Rockingham+Western+Australia",  lat:-32.28, lon:115.73 },
    { name:"Joondalup",   query:"Joondalup+Western+Australia",   lat:-31.74, lon:115.77 },
  ];
  const [locIdx, setLocIdx] = React.useState(0);
  const [weather, setWeather] = React.useState(null);
  const [error, setError] = React.useState(false);
  const loc = LOCATIONS[locIdx];

  React.useEffect(() => {
    setWeather(null);
    setError(false);
    fetch("https://wttr.in/" + loc.query + "?format=j1")
      .then(r => { if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .then(data => {
        const cur = data.current_condition && data.current_condition[0];
        if(cur) {
          setWeather({
            temp: Math.round(parseFloat(cur.temp_C)),
            wind: Math.round(parseFloat(cur.windspeedKmph)),
            windDeg: parseFloat(cur.winddirDegree),
            code: parseInt(cur.weatherCode),
            rainChance: data.weather && data.weather[0] && data.weather[0].hourly
              ? Math.max(...data.weather[0].hourly.map(h=>parseInt(h.chanceofrain)||0))
              : null,
          });
        } else { setError(true); }
      })
      .catch(() => {
        fetch("https://api.open-meteo.com/v1/forecast?latitude="+loc.lat+"&longitude="+loc.lon+"&current=temperature_2m,wind_speed_10m,wind_direction_10m,weather_code&daily=precipitation_probability_max&timezone=Australia%2FPerth&forecast_days=1")
          .then(r=>r.json())
          .then(data => {
            if(data && data.current) {
              setWeather({
                temp: Math.round(data.current.temperature_2m),
                wind: Math.round(data.current.wind_speed_10m),
                windDeg: data.current.wind_direction_10m,
                code: data.current.weather_code,
                rainChance: data.daily && data.daily.precipitation_probability_max ? data.daily.precipitation_probability_max[0] : null,
              });
            } else { setError(true); }
          })
          .catch(() => setError(true));
      });
  }, [locIdx]);

  return (
    <div style={{flex:1,background:"rgba(255,255,255,0.12)",borderRadius:14,border:"1px solid rgba(255,255,255,0.25)",backdropFilter:"blur(10px)",WebkitBackdropFilter:"blur(10px)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"10px 6px",minHeight:140,cursor:"pointer"}}
      onClick={() => { setLocIdx(i => (i+1) % LOCATIONS.length); }}>
      <div style={{fontSize:9,color:"#86efac",letterSpacing:1,marginBottom:2,fontWeight:700}}>WEATHER</div>
      <div style={{fontSize:9,color:"rgba(255,255,255,0.5)",marginBottom:6}}>{loc.name} ›</div>
      {weather ? (
        <>
          <div style={{fontSize:28}}>{weatherIcon(weather.code)}</div>
          <div style={{fontSize:22,fontWeight:900,color:"#fff",lineHeight:1.2}}>{weather.temp}°</div>
          <div style={{fontSize:9,color:"rgba(255,255,255,0.6)",marginTop:4,textAlign:"center"}}>💨 {weather.wind}km/h {windDir(weather.windDeg)}</div>
          {weather.rainChance !== null && (
            <div style={{fontSize:9,color:"rgba(255,255,255,0.6)",marginTop:2}}>💧 {weather.rainChance}%</div>
          )}
        </>
      ) : error ? (
        <div style={{fontSize:9,color:"rgba(255,255,255,0.35)",textAlign:"center"}}>Unavailable</div>
      ) : (
        <div style={{fontSize:9,color:"rgba(255,255,255,0.4)"}}>Loading...</div>
      )}
    </div>
  );
}
function CourseSelector({ courseKey, setCourseKey }) {
  const [openRegion, setOpenRegion] = React.useState(null);
  const [openGroup, setOpenGroup] = React.useState(null);

  const COURSE_GROUPS = {
    joondalup: {
      name: "Joondalup Resort",
      icon: "🏌️",
      maps: "https://www.joondalupresort.com.au",
      keys: ["joondalup_dune","joondalup_quarry","joondalup_lakes","joondalup_dune_quarry","joondalup_dune_lakes","joondalup_quarry_lakes"],
    },
  };

  const getGroup = (key) => Object.entries(COURSE_GROUPS).find(([,g]) => g.keys.includes(key));

  const handleSelect = (key) => {
    setCourseKey(key);
    setOpenRegion(null);
    setOpenGroup(null);
  };

  const regionStyles = {
    "🏙️ Perth City & East":        { color:"#60a5fa" },
    "🌊 Perth South & Fremantle":  { color:"#34d399" },
    "🌿 Perth North":              { color:"#a78bfa" },
    "🏔️ Perth Hills & East":      { color:"#a3e635" },
    "🌴 Mandurah & Beyond":        { color:"#f59e0b" },
    "🗺️ Regional WA":             { color:"#f87171" },
  };

  const selectedCourse = courseKey ? COURSES[courseKey] : null;

  const getDisplayKeys = (keys) => {
    const seen = new Set();
    const result = [];
    keys.forEach(key => {
      const group = getGroup(key);
      if(group) {
        const [groupId] = group;
        if(!seen.has(groupId)) { seen.add(groupId); result.push({type:'group', groupId}); }
      } else {
        result.push({type:'course', key});
      }
    });
    return result;
  };

  return (
    <div style={{marginBottom:14}}>
      {selectedCourse ? (
        <div style={{background:"rgba(255,255,255,0.1)",backdropFilter:"blur(10px)",borderRadius:12,padding:"10px 14px",marginBottom:10,border:"1.5px solid #86efac",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontSize:9,color:"#86efac",letterSpacing:1.5,marginBottom:1}}>SELECTED COURSE</div>
            <div style={{fontSize:14,fontWeight:800,color:"#fff"}}>{selectedCourse.name}</div>
            <div style={{fontSize:10,color:"rgba(255,255,255,0.45)"}}>{selectedCourse.state}</div>
          </div>
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            {selectedCourse.maps && <button onClick={e=>{e.stopPropagation();window.open(selectedCourse.maps,"_blank");}} style={{background:"rgba(96,165,250,0.15)",border:"1px solid rgba(96,165,250,0.4)",borderRadius:7,color:"#60a5fa",padding:"4px 8px",fontSize:10,cursor:"pointer",fontFamily:"Georgia,serif"}}>🌐</button>}
            <button onClick={()=>setCourseKey("")} style={{background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:7,color:"rgba(255,255,255,0.5)",padding:"4px 8px",fontSize:10,cursor:"pointer",fontFamily:"Georgia,serif"}}>Change</button>
          </div>
        </div>
      ) : (
        <div style={{background:"rgba(255,255,255,0.07)",borderRadius:12,padding:"8px 14px",marginBottom:10,border:"1.5px dashed rgba(134,239,172,0.3)",textAlign:"center"}}>
          <div style={{fontSize:12,color:"rgba(255,255,255,0.4)"}}>⛳ Tap a region to select your course</div>
        </div>
      )}

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:openRegion?8:0}}>
        {Object.entries(REGIONS).map(([region, keys]) => {
          const isOpen = openRegion === region;
          const hasSelected = keys.includes(courseKey) || keys.some(k => { const g = getGroup(k); return g && g[1].keys.includes(courseKey); });
          const style = regionStyles[region] || { color:"#86efac" };
          const emoji = region.split(" ")[0];
          const label = region.split(" ").slice(1).join(" ");
          return (
            <button key={region} onClick={()=>setOpenRegion(isOpen?null:region)} style={{
              padding:"10px 8px",borderRadius:10,cursor:"pointer",
              border:"1px solid "+(hasSelected?style.color:isOpen?"rgba(255,255,255,0.2)":"rgba(255,255,255,0.08)"),
              background:hasSelected?"rgba(255,255,255,0.15)":isOpen?"rgba(255,255,255,0.1)":"rgba(255,255,255,0.06)",
              fontFamily:"Georgia,serif",textAlign:"center",
            }}>
              <div style={{fontSize:18,marginBottom:3}}>{emoji}</div>
              <div style={{fontSize:10,fontWeight:700,color:hasSelected?style.color:isOpen?"#fff":"rgba(255,255,255,0.6)",lineHeight:1.2}}>{label}</div>
              <div style={{fontSize:9,color:"rgba(255,255,255,0.3)",marginTop:2}}>{keys.length} courses</div>
              {hasSelected && <div style={{fontSize:9,color:style.color,marginTop:2,fontWeight:700}}>✓</div>}

          );
        })}
      </div>

      {openRegion && (
        <div style={{background:"rgba(255,255,255,0.06)",borderRadius:12,padding:8,border:"1px solid rgba(255,255,255,0.1)"}}>

            {openRegion.split(" ").slice(1).join(" ").toUpperCase()}
          </div>
          {getDisplayKeys(REGIONS[openRegion]).map((item) => {
            const style = regionStyles[openRegion] || { color:"#86efac" };

            if(item.type === 'group') {
              const group = COURSE_GROUPS[item.groupId];
              const isGroupOpen = openGroup === item.groupId;
              const groupSelected = group.keys.includes(courseKey);
              return (
                <div key={item.groupId} style={{marginBottom:3}}>
                  <div onClick={()=>setOpenGroup(isGroupOpen?null:item.groupId)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 10px",borderRadius:8,cursor:"pointer",background:groupSelected?"rgba(134,239,172,0.12)":isGroupOpen?"rgba(255,255,255,0.08)":"rgba(255,255,255,0.04)",border:"1px solid "+(groupSelected?style.color:isGroupOpen?"rgba(255,255,255,0.15)":"rgba(255,255,255,0.05)")}}>
                    <div>
                      <div style={{fontSize:12,fontWeight:700,color:groupSelected?style.color:"#fff"}}>{group.icon} {group.name}</div>
                      <div style={{fontSize:9,color:"rgba(255,255,255,0.3)"}}>6 course options · Tap to expand</div>
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:5}}>
                      {group.maps && <button onClick={e=>{e.stopPropagation();window.open(group.maps,"_blank");}} style={{background:"rgba(96,165,250,0.1)",border:"1px solid rgba(96,165,250,0.3)",borderRadius:6,color:"#60a5fa",padding:"3px 6px",fontSize:9,cursor:"pointer",fontFamily:"Georgia,serif"}}>🌐</button>}
                      {groupSelected ? <span style={{color:style.color,fontSize:12}}>✓</span> : <span style={{color:"rgba(255,255,255,0.3)",fontSize:11}}>{isGroupOpen?"▲":"▼"}</span>}
                    </div>
                  </div>
                  {isGroupOpen && (
                    <div style={{marginTop:3,paddingLeft:8}}>
                      <div style={{fontSize:9,color:"rgba(255,255,255,0.3)",letterSpacing:1,padding:"4px 6px"}}>9 HOLES</div>
                      {group.keys.filter(k=>COURSES[k]&&COURSES[k].holes&&COURSES[k].holes.length===9).map(key => {
                        const course = COURSES[key];
                        const selected = courseKey === key;
                        return (
                          <div key={key} onClick={()=>handleSelect(key)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"6px 10px",borderRadius:8,marginBottom:2,cursor:"pointer",background:selected?"rgba(134,239,172,0.12)":"rgba(255,255,255,0.04)",border:"1px solid "+(selected?style.color:"rgba(255,255,255,0.05)")}}>
                            <div style={{fontSize:11,color:selected?style.color:"#fff"}}>{course.name.replace("Joondalup (","").replace(")","").replace(" — 9 holes","")}</div>
                            {selected && <span style={{color:style.color,fontSize:12}}>✓</span>}
                          </div>
                        );
                      })}
                      <div style={{fontSize:9,color:"rgba(255,255,255,0.3)",letterSpacing:1,padding:"4px 6px",marginTop:4}}>18 HOLES</div>
                      {group.keys.filter(k=>COURSES[k]&&COURSES[k].holes&&COURSES[k].holes.length===18).map(key => {
                        const course = COURSES[key];
                        const selected = courseKey === key;
                        return (
                          <div key={key} onClick={()=>handleSelect(key)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"6px 10px",borderRadius:8,marginBottom:2,cursor:"pointer",background:selected?"rgba(134,239,172,0.12)":"rgba(255,255,255,0.04)",border:"1px solid "+(selected?style.color:"rgba(255,255,255,0.05)")}}>
                            <div style={{fontSize:11,color:selected?style.color:"#fff"}}>{course.name.replace("Joondalup (","").replace(")","").replace(" — 18","")}</div>
                            {selected && <span style={{color:style.color,fontSize:12}}>✓</span>}
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            }

            const course = COURSES[item.key];
            if(!course) return null;
            const selected = courseKey === item.key;
            const par = course.holes ? course.holes.reduce((s,h)=>s+h.par,0) : 72;
            const holes = course.holes ? course.holes.length : 18;
            return (
              <div key={item.key} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 10px",borderRadius:8,marginBottom:3,cursor:"pointer",background:selected?"rgba(134,239,172,0.12)":"rgba(255,255,255,0.04)",border:"1px solid "+(selected?style.color:"rgba(255,255,255,0.05)")}}>
                <div onClick={()=>handleSelect(item.key)} style={{flex:1}}>
                  <div style={{fontSize:12,fontWeight:selected?700:400,color:selected?style.color:"#fff"}}>{course.name}</div>
                  <div style={{fontSize:9,color:"rgba(255,255,255,0.3)"}}>{holes===9?"9 holes":"18 holes"} · Par {par}</div>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:5}}>
                  {course.maps && <button onClick={e=>{e.stopPropagation();window.open(course.maps,"_blank");}} style={{background:"rgba(96,165,250,0.1)",border:"1px solid rgba(96,165,250,0.3)",borderRadius:6,color:"#60a5fa",padding:"3px 6px",fontSize:9,cursor:"pointer",fontFamily:"Georgia,serif"}}>🌐</button>}
                  {selected ? <span style={{color:style.color,fontSize:12}}>✓</span> : <span onClick={()=>handleSelect(item.key)} style={{color:"rgba(255,255,255,0.2)",fontSize:11,cursor:"pointer"}}>›</span>}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}
function Section({ label, children, color, icon }) {
  return (
    <div style={{background:"rgba(255,255,255,0.1)",backdropFilter:"blur(10px)",WebkitBackdropFilter:"blur(10px)",borderRadius:14,padding:"14px 16px",marginBottom:10,border:"1px solid rgba(255,255,255,0.2)"}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
        {icon && <div style={{width:28,height:28,borderRadius:7,background:"rgba(255,255,255,0.12)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,flexShrink:0}}>{icon}</div>}
        <div style={{fontSize:11,color:color||"#86efac",letterSpacing:2,fontWeight:700}}>{label}</div>
      </div>
      {children}
    </div>
  );
}

function ScoringScreen({ gameState, onReset, onPause, onShowBets, onShowDistance }) {
  const { players, course, format, ambroseFormat, nineHoles, tournamentCode, groupName, tournMode, tournType, ldHoles=[], ctpHoles=[], liveCode } = gameState;
  const n = players.length;
  const totalH = course.holes.length;

  const isStable = format === "stableford";
  const isStroke = format === "stroke";
  const isMatch = format === "matchplay";
  const isSkins = format === "skins";
  const isAmbrose = format === "ambrose";
  const isTournament = format === "tournament";
  const isTournAmb = isTournament && tournType === "ambrose";
  const isAnyAmbrose = isAmbrose || isTournAmb;
  const ambIsStable = ambroseFormat === "stableford";
  const indivIsStable = isStable || (isTournament && !isTournAmb);

  /* ===== AUTO-SAVE: scores survive navigation, app close, crashes ===== */
  const AUTOSAVE_KEY = 'cc_round_autosave';
  const roundSig = course.name + '|' + players.map(p=>p.name).join(',') + '|' + format + '|' + totalH;
  const _saved = (() => {
    try {
      const s = JSON.parse(localStorage.getItem(AUTOSAVE_KEY));
      return (s && s.sig === roundSig) ? s : null;
    } catch(e) { return null; }
  })();

  const [scores, setScores] = useState(() => (_saved && _saved.scores) ? _saved.scores : Array.from({length:n}, () => Array(totalH).fill("")));
  const [ambScores, setAmbScores] = useState(() => (_saved && _saved.ambScores) ? _saved.ambScores : Array(totalH).fill(""));
  const [activePlayer, setActivePlayer] = useState(_saved ? (_saved.activePlayer||0) : 0);
  const [activeHole, setActiveHole] = useState(_saved ? (_saved.activeHole||0) : 0);
  const [view, setView] = useState("entry");
  const [ldWinners, setLdWinners] = useState(() => (_saved && _saved.ldWinners) ? _saved.ldWinners : Object.fromEntries(ldHoles.map(h => [h, null])));
  const [ctpWinners, setCtpWinners] = useState(() => (_saved && _saved.ctpWinners) ? _saved.ctpWinners : Object.fromEntries(ctpHoles.map(h => [h, null])));
  const [showShare, setShowShare] = useState(false);
  const [roundSaved, setRoundSaved] = useState(false);
  const [milestones, setMilestones] = useState([]);

  /* Save everything after every change */
  React.useEffect(() => {
    try {
      localStorage.setItem(AUTOSAVE_KEY, JSON.stringify({
        sig: roundSig, scores, ambScores, activePlayer, activeHole, ldWinners, ctpWinners
      }));
    } catch(e) {}
  }, [scores, ambScores, activePlayer, activeHole, ldWinners, ctpWinners]);

  /* ===== LIVE ROUND: push scores to the room so mates see the live leaderboard ===== */
  React.useEffect(() => {
    if(!liveCode) return;
    const t = setTimeout(() => {
      pushLiveRound(liveCode, gameState, scores).catch(()=>{});
    }, 1500);
    return () => clearTimeout(t);
  }, [scores]);

  const updateScore = (pi, hi, val) =>
    setScores(prev => prev.map((row, r) => r===pi ? row.map((s,c) => c===hi ? val : s) : row));
  const updateAmb = (hi, val) => setAmbScores(prev => prev.map((s,i) => i===hi ? val : s));

  const getShots = (pi, hi) => shotsReceived(course.holes[hi].si, players[pi].handicap, nineHoles);
  const getAmbShots = (hi) => {
    const avgH = Math.round(players.reduce((s,p)=>s+(p.handicap||0),0)/(n*4));
    return shotsReceived(course.holes[hi].si, avgH*n, nineHoles);
  };

  const getPoints = (pi, hi) => {
    const s = scores[pi][hi];
    if (s === "") return null;
    if (indivIsStable) return stablefordPts(s, course.holes[hi].par, getShots(pi,hi));
    return null;
  };
  const getAmbPoints = (hi) => {
    const s = ambScores[hi];
    if (s === "") return null;
    if (ambIsStable) return stablefordPts(s, course.holes[hi].par, getAmbShots(hi));
    return null;
  };

  const totalPar = course.holes.reduce((s,h) => s+h.par, 0);
  const totalGross = (pi) => scores[pi].reduce((s,v) => s+(parseInt(v)||0), 0);
  const totalPoints = (pi) => course.holes.reduce((sum,_,i) => sum+(getPoints(pi,i)||0), 0);
  const holesPlayed = (pi) => (isAnyAmbrose ? ambScores : scores[pi]).filter(s => s!=="").length;
  const ninePoints = (pi, start) => course.holes.slice(start,start+9).reduce((sum,_,i) => sum+(getPoints(pi,start+i)||0), 0);
  const nineGross = (pi, start) => scores[pi].slice(start,start+9).reduce((s,v) => s+(parseInt(v)||0), 0);
  const ambTotal = () => ambIsStable
    ? course.holes.reduce((sum,_,i) => sum+(getAmbPoints(i)||0), 0)
    : ambScores.reduce((s,v) => s+(parseInt(v)||0), 0);
  const ambGross = () => ambScores.reduce((s,v) => s+(parseInt(v)||0), 0);

  const matchResult = (hi) => {
    const s0=parseInt(scores[0][hi]), s1=parseInt(scores[1][hi]);
    if(isNaN(s0)||isNaN(s1)) return null;
    const n0=s0-getShots(0,hi), n1=s1-getShots(1,hi);
    if(n0<n1) return 0; if(n1<n0) return 1; return "half";
  };
  const matchStanding = () => {
    let p0=0,p1=0;
    course.holes.forEach((_,i) => { const r=matchResult(i); if(r===0)p0++; else if(r===1)p1++; });
    const diff=p0-p1, hl=course.holes.filter((_,i)=>matchResult(i)===null).length;
    if(diff>0) return {leader:0,diff,hl}; if(diff<0) return {leader:1,diff:-diff,hl}; return {leader:"as",diff:0,hl};
  };
  const skinResults = () => {
    let carry=0, skins=Array(n).fill(0), skinWinner=Array(totalH).fill(null), skinVal=Array(totalH).fill(0);
    course.holes.forEach((h,i) => {
      const hscores = players.map((_,pi) => { const s=scores[pi][i]; return s===""?Infinity:parseInt(s)-getShots(pi,i); });
      const min = Math.min(...hscores);
      const winners = hscores.map((s,pi) => s===min?pi:-1).filter(x=>x>=0);
      carry++;
      if(winners.length===1) { skins[winners[0]]+=carry; skinVal[i]=carry; skinWinner[i]=winners[0]; carry=0; }
      else { skinVal[i]=carry; }
    });
    return {skins,skinWinner,skinVal,carry};
  };

  const hole = course.holes[activeHole];
  const shots = getShots(activePlayer, activeHole);
  const ambShots = getAmbShots(activeHole);
  const curS = isAnyAmbrose ? ambScores[activeHole] : scores[activePlayer][activeHole];
  const curPts = curS !== "" ? (isAnyAmbrose ? (ambIsStable ? stablefordPts(curS,hole.par,ambShots):null) : (indivIsStable ? stablefordPts(curS,hole.par,shots):null)) : null;
  const curDiff = curS !== "" ? parseInt(curS)-hole.par : null;

  const sorted = [...players.map((p,i)=>({...p,idx:i}))].sort((a,b) =>
    indivIsStable ? totalPoints(b.idx)-totalPoints(a.idx) : totalGross(a.idx)-totalGross(b.idx));
  const skinData = isSkins ? skinResults() : null;
  const matchData = isMatch ? matchStanding() : null;
  const holesLabel = nineHoles ? (course.holes[0].hole<=9?"Front 9":"Back 9") : "18 Holes";
  const showCompsTab = isTournament && (ldHoles.length>0||ctpHoles.length>0);

  const dotLabel = (filled, pi, hi) => {
    if(!filled) return course.holes[hi].hole;
    const s = isAnyAmbrose ? ambScores[hi] : scores[pi][hi];
    const h = course.holes[hi];
    if(indivIsStable||(isAnyAmbrose&&ambIsStable)) { const p=isAnyAmbrose?getAmbPoints(hi):getPoints(pi,hi); return p!==null?p:"·"; }
    if(isStroke||(isAnyAmbrose&&!ambIsStable)) { const d=parseInt(s)-h.par; return d===0?"E":d>0?"+"+d:d; }
    if(isMatch) { const r=matchResult(hi); return r===0?"W":r===1?"L":r==="half"?"H":"·"; }
    if(isSkins) { return skinData&&skinData.skinWinner[hi]===pi?"✓":"·"; }
    return "·";
  };

  return (
    <div style={{minHeight:"100vh",backgroundImage:`url(${BG_PHOTO})`,backgroundSize:"cover",backgroundPosition:"center",backgroundRepeat:"no-repeat",backgroundAttachment:"fixed",padding:"14px 14px 30px",color:"#fff",fontFamily:"Georgia,serif"}}>

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <div>
          <div style={{fontSize:24,fontWeight:900,letterSpacing:-1}}>Card Caddie</div>
          <div style={{fontSize:10,color:"#86efac"}}>{course.name} · {FORMAT_LABELS[format]} · {holesLabel}</div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          {isTournament&&tournamentCode&&(
            <div style={{background:"rgba(251,191,36,0.2)",border:"1px solid #fbbf24",borderRadius:8,padding:"4px 10px",fontSize:13,color:"#fbbf24",fontWeight:900,letterSpacing:3}}>{tournamentCode}</div>
          )}
          <div style={{display:"flex",gap:6}}>
            <button onClick={() => {
              if(!roundSaved) {
                const record = saveRound(gameState, scores, ambScores, totalPar);
                setRoundSaved(true);
                if(record&&record.winner&&gameState.players.length>1){
                  const beers=loadBeers();
                  gameState.players.forEach(p=>{if(p.name!==record.winner)beers[p.name]=(beers[p.name]||0)+1;});
                  saveBeers(beers);
                }
                const hist=loadHistory();
                const ms=checkMilestones(record,hist.slice(1));
                if(ms.length>0)setMilestones(ms);
                // Sync to cloud silently
                if(record) syncRoundToCloud(record).catch(()=>{});
              }
              setShowShare(true);
            }} style={{background:"rgba(34,197,94,0.2)",border:"1px solid rgba(34,197,94,0.4)",borderRadius:8,color:"#22c55e",padding:"6px 12px",fontSize:11,cursor:"pointer",fontFamily:"Georgia,serif"}}>
              📤 Share
            </button>
            <div style={{display:"flex",gap:6}}>
              <button onClick={onShowDistance} style={{background:"rgba(96,165,250,0.15)",border:"1px solid rgba(96,165,250,0.4)",borderRadius:8,color:"#60a5fa",padding:"6px 10px",fontSize:11,cursor:"pointer",fontFamily:"Georgia,serif"}}>📏</button>
              <button onClick={onShowBets} style={{background:"rgba(251,191,36,0.15)",border:"1px solid rgba(251,191,36,0.4)",borderRadius:8,color:"#fbbf24",padding:"6px 10px",fontSize:11,cursor:"pointer",fontFamily:"Georgia,serif"}}>💰</button>
              {course.maps && <button onClick={()=>window.open("https://maps.google.com/?q="+encodeURIComponent(course.name+"+"+course.state)+"&t=k","_blank")} style={{background:"rgba(134,239,172,0.15)",border:"1px solid rgba(134,239,172,0.4)",borderRadius:8,color:"#86efac",padding:"6px 10px",fontSize:11,cursor:"pointer",fontFamily:"Georgia,serif"}}>🗺️</button>}
              <button onClick={onPause} style={{background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.2)",borderRadius:8,color:"#fff",padding:"6px 10px",fontSize:11,cursor:"pointer",fontFamily:"Georgia,serif"}}>🏠</button>
              <button onClick={()=>{if(window.confirm("End this round? All progress will be lost."))onReset();}} style={{background:"rgba(239,68,68,0.15)",border:"1px solid rgba(239,68,68,0.4)",borderRadius:8,color:"#f87171",padding:"6px 10px",fontSize:11,cursor:"pointer",fontFamily:"Georgia,serif"}}>✕ End</button>
            </div>
          </div>
        </div>
      </div>

      {isTournament&&tournMode==="create"&&(
        <div style={{background:"rgba(251,191,36,0.1)",border:"1px solid rgba(251,191,36,0.3)",borderRadius:12,padding:12,marginBottom:14,textAlign:"center"}}>
          <div style={{fontSize:10,color:"#fbbf24",letterSpacing:2,marginBottom:4}}>SHARE THIS CODE WITH OTHER GROUPS</div>
          <div style={{fontSize:38,fontWeight:900,letterSpacing:10,color:"#fbbf24"}}>{tournamentCode}</div>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginTop:4}}>{groupName}</div>
        </div>
      )}

      {isMatch&&matchData&&(
        <div style={{background:"rgba(56,189,248,0.1)",border:"1px solid rgba(56,189,248,0.3)",borderRadius:12,padding:12,marginBottom:14,textAlign:"center"}}>
          {matchData.leader==="as"
            ? <div style={{fontSize:16,fontWeight:700,color:"#38bdf8"}}>All Square</div>
            : <div style={{fontSize:16,fontWeight:700,color:PLAYER_COLORS[matchData.leader]}}>{players[matchData.leader].name} {matchData.diff} UP {matchData.hl>0&&<span style={{fontSize:12,fontWeight:400,color:"rgba(255,255,255,0.5)"}}>· {matchData.hl} to play</span>}</div>
          }
        </div>
      )}

      {isSkins&&skinData&&(
        <div style={{background:"rgba(251,191,36,0.1)",border:"1px solid rgba(251,191,36,0.3)",borderRadius:12,padding:10,marginBottom:14}}>
          <div style={{fontSize:10,color:"#fbbf24",letterSpacing:2,marginBottom:6}}>SKINS TALLY</div>
          <div style={{display:"flex",gap:8,justifyContent:"space-around"}}>
            {players.map((p,i) => (
              <div key={i} style={{textAlign:"center"}}>
                <div style={{fontSize:20,fontWeight:900,color:PLAYER_COLORS[i]}}>{skinData.skins[i]}</div>
                <div style={{fontSize:10,color:"rgba(255,255,255,0.5)"}}>{p.name.split(" ")[0]}</div>
              </div>
            ))}
            {skinData.carry>0&&<div style={{textAlign:"center"}}><div style={{fontSize:20,fontWeight:900,color:"#fbbf24"}}>{skinData.carry}</div><div style={{fontSize:10,color:"#fbbf24"}}>Carry</div></div>}
          </div>
        </div>
      )}

      {isAnyAmbrose&&(
        <div style={{background:"rgba(251,146,60,0.15)",border:"1px solid rgba(251,146,60,0.3)",borderRadius:12,padding:12,marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{fontSize:13,fontWeight:700,color:"#fed7aa"}}>Team Ambrose · {ambroseFormat==="stableford"?"Stableford":"Stroke"}</div>
              <div style={{fontSize:11,color:"rgba(255,255,255,0.5)"}}>{players.map(p=>p.name).join(" · ")}</div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:22,fontWeight:900,color:"#fb923c"}}>{ambTotal()}{ambIsStable?" pts":" gross"}</div>
            </div>
          </div>
        </div>
      )}

      {liveCode && (
        <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,background:"rgba(134,239,172,0.1)",border:"1px solid rgba(134,239,172,0.35)",borderRadius:10,padding:"7px 12px",marginBottom:12}}>
          <div style={{width:7,height:7,borderRadius:"50%",background:"#22c55e",animation:"pulse 1.5s ease-in-out infinite"}}/>
          <div style={{fontSize:11,color:"#86efac",fontWeight:700,letterSpacing:1}}>LIVE · ROOM CODE</div>
          <div style={{fontSize:15,color:"#fff",fontWeight:900,letterSpacing:3}}>{liveCode}</div>
        </div>
      )}

      {!isAnyAmbrose&&(
        <div style={{display:"flex",gap:6,marginBottom:12,overflowX:"auto",paddingBottom:2}}>
          {players.map((p,i) => (
            <button key={i} onClick={() => setActivePlayer(i)} style={{
              flexShrink:0,padding:"7px 12px",borderRadius:10,
              border:"2px solid "+(activePlayer===i?PLAYER_COLORS[i]:"rgba(255,255,255,0.15)"),
              background:activePlayer===i?PLAYER_BG[i]:"transparent",
              color:activePlayer===i?PLAYER_COLORS[i]:"rgba(255,255,255,0.5)",
              fontWeight:700,fontSize:12,cursor:"pointer",fontFamily:"Georgia,serif",
            }}>
              <div>{p.name}</div>
              <div style={{fontSize:10,fontWeight:400}}>
                {holesPlayed(i)>0 ? (indivIsStable?totalPoints(i)+" pts":isSkins?skinData.skins[i]+" skins":isMatch?"":totalGross(i)) : "Hdcp "+p.handicap}
              </div>
            </button>
          ))}
        </div>
      )}

      <div style={{display:"flex",gap:6,marginBottom:16}}>
        {[["entry","⛳ Score"],["card","📋 Card"],["board","🏆 Board"],...(showCompsTab?[["comps","🎯 Comps"]]:[])].map(([v,label]) => (
          <button key={v} onClick={() => setView(v)} style={{
            flex:1,padding:"7px 0",borderRadius:20,border:"1px solid rgba(255,255,255,0.2)",
            background:view===v?"#fff":"transparent",color:view===v?"#0a3d1f":"#fff",
            fontWeight:700,fontSize:12,cursor:"pointer",fontFamily:"Georgia,serif",
          }}>{label}</button>
        ))}
      </div>

      {view==="entry"&&(
        <div>
          <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:16,justifyContent:"center"}}>
            {course.holes.map((h,i) => {
              const s = isAnyAmbrose ? ambScores[i] : scores[activePlayer][i];
              const filled = s !== "";
              const dl = dotLabel(filled, activePlayer, i);
              return (
                <button key={i} onClick={() => { setActiveHole(i); setActivePlayer(0); }} style={{
                  width:33,height:33,borderRadius:"50%",
                  border:"2px solid "+(activeHole===i?"#fff":filled?PLAYER_COLORS[isAnyAmbrose?0:activePlayer]:"rgba(255,255,255,0.2)"),
                  background:activeHole===i?"#fff":filled?PLAYER_COLORS[isAnyAmbrose?0:activePlayer]+"33":"transparent",
                  color:activeHole===i?"#0a3d1f":"#fff",fontWeight:700,fontSize:11,cursor:"pointer",
                }}>{dl}</button>
              );
            })}
          </div>

          <div style={{background:"rgba(10,61,31,0.85)",borderRadius:18,padding:"18px 16px",maxWidth:400,margin:"0 auto"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}}>
              <div>
                <div style={{fontSize:10,color:"#86efac",letterSpacing:2}}>HOLE</div>
                <div style={{fontSize:52,fontWeight:900,lineHeight:1}}>{hole.hole}</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{background:"rgba(255,255,255,0.1)",borderRadius:8,padding:"4px 10px",marginBottom:4}}>
                  <span style={{color:"#86efac",fontSize:12}}>Par {hole.par}</span>
                  <span style={{color:"rgba(255,255,255,0.4)",fontSize:11,marginLeft:6}}>SI {hole.si}</span>
                </div>
                <div style={{fontSize:12,color:PLAYER_COLORS[isAnyAmbrose?0:activePlayer]}}>
                  {isAnyAmbrose ? "Team · +" + ambShots + " shots" : players[activePlayer].name + " · +" + shots + " shot" + (shots!==1?"s":"")}
                </div>
              </div>
            </div>

            {isMatch&&matchResult(activeHole)!==null&&(
              <div style={{textAlign:"center",marginBottom:12,padding:"8px",borderRadius:10,
                background:matchResult(activeHole)===0?"rgba(34,197,94,0.2)":matchResult(activeHole)===1?"rgba(239,68,68,0.2)":"rgba(255,255,255,0.1)"}}>
                <span style={{fontWeight:700}}>
                  {matchResult(activeHole)===0?players[0].name+" wins hole":matchResult(activeHole)===1?players[1].name+" wins hole":"Halved"}
                </span>
              </div>
            )}

            {isSkins&&skinData&&(
              <div style={{textAlign:"center",marginBottom:12,fontSize:12,color:"#fbbf24"}}>
                {skinData.skinWinner[activeHole]!==null
                  ? players[skinData.skinWinner[activeHole]].name + " won " + skinData.skinVal[activeHole] + " skin" + (skinData.skinVal[activeHole]>1?"s":"") + "! 💰"
                  : skinData.skinVal[activeHole]>1 ? skinData.skinVal[activeHole]+" skins carrying forward..." : "Skin on the line"}
              </div>
            )}

    // ── Supabase helpers ──────────────────────────────────────────────────────
    async function supaFetch(path, opts={}) {
      try {
        const res = await fetch(SUPA_URL + '/rest/v1/' + path, {
          headers: {
            'apikey': SUPA_KEY,
            'Authorization': 'Bearer ' + SUPA_KEY,
            'Content-Type': 'application/json',
            'Prefer': opts.prefer || 'return=representation',
          },
          ...opts,
        });
        if(!res.ok) return null;
        const text = await res.text();
        return text ? JSON.parse(text) : null;
      } catch(e) { return null; }
    }

    function genPlayerId() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let id = 'CC-';
      for(let i=0;i<4;i++) id += chars[Math.floor(Math.random()*chars.length)];
      return id;
    }

    // Initialise player ID ONCE at startup — never changes after this
    const _PLAYER_ID = (() => {
      try {
        // Try localStorage first
        let id = localStorage.getItem(PLAYER_ID_KEY);
        if(id && id.length >= 7) return id;
        // Try sessionStorage as backup
        id = sessionStorage.getItem(PLAYER_ID_KEY);
        if(id && id.length >= 7) {
          // Promote to localStorage
          try { localStorage.setItem(PLAYER_ID_KEY, id); } catch(e) {}
          return id;
        }
        // Generate new ID
        id = genPlayerId();
        try { localStorage.setItem(PLAYER_ID_KEY, id); } catch(e) {}
        try { sessionStorage.setItem(PLAYER_ID_KEY, id); } catch(e) {}
        return id;
      } catch(e) {
        return genPlayerId();
      }
    })();

    function checkMilestones(record, history) {
      const ms = [];
      const isStable = record.format==='stableford'||record.format==='tournament';
      record.players.forEach(p => {
        const val = isStable ? p.pts : p.gross;
        if(!val) return;
        const prev = history.filter(r => r.players.some(rp=>rp.name===p.name));
        const prevBest = prev.reduce((best,r)=>{
          const rp=r.players.find(rp=>rp.name===p.name);
          if(!rp)return best;
          const rv=isStable?rp.pts:rp.gross;
          if(!rv)return best;
          return isStable?Math.max(best,rv):Math.min(best,rv||999);
        }, isStable?0:999);
        if(isStable&&val>prevBest&&prev.length>0) ms.push({player:p.name,msg:'🏅 Personal best! '+val+' pts'});
        if(!isStable&&val<prevBest&&prev.length>0) ms.push({player:p.name,msg:'🏅 Personal best! '+val+' gross'});
        const wins=history.filter(r=>r.winner===p.name);
        if(record.winner===p.name&&wins.length>=2) ms.push({player:p.name,msg:'🔥 '+(wins.length+1)+' wins in a row!'});
        if(record.winner===p.name&&wins.length===0&&history.length>0) ms.push({player:p.name,msg:'🎉 First win recorded!'});
      });
      return ms;
    }

        return byPlayer;
      }, [history]);

      // ── Achievement Badges ──
      const badges = React.useMemo(() => {
        const allPlayers = [...new Set(history.flatMap(r=>r.players.map(p=>p.name)))];
        return allPlayers.map(name => {
          const playerRounds = history.filter(r=>r.players.some(p=>p.name===name));
          const wins = history.filter(r=>r.winner===name).length;
          const stableRounds = playerRounds.filter(r=>r.format==="stableford"||r.format==="tournament");
          const bestPts = stableRounds.reduce((best,r)=>{
            const p = r.players.find(p=>p.name===name);
            return p&&p.pts>best?p.pts:best;
          }, 0);
          const strokeRounds = playerRounds.filter(r=>r.format==="stroke");
          const bestGross = strokeRounds.reduce((best,r)=>{
            const p = r.players.find(p=>p.name===name);
            return p&&p.gross&&p.gross<best?p.gross:best;
          }, 999);
          const courses = new Set(playerRounds.map(r=>r.course)).size;

          const earned = [];
          if(playerRounds.length>=1) earned.push({icon:"🏌️",label:"First Round",desc:"Played your first round"});
          if(playerRounds.length>=5) earned.push({icon:"⛳",label:"Regular",desc:"5 rounds played"});
          if(playerRounds.length>=10) earned.push({icon:"🔟",label:"10 Club",desc:"10 rounds played"});
          if(playerRounds.length>=25) earned.push({icon:"🌟",label:"Veteran",desc:"25 rounds played"});
          if(wins>=1) earned.push({icon:"🥇",label:"Winner",desc:"First round win"});
          if(wins>=5) earned.push({icon:"🏆",label:"Champion",desc:"5 round wins"});
          if(wins>=10) earned.push({icon:"👑",label:"Legend",desc:"10 round wins"});
          if(bestPts>=36) earned.push({icon:"🔥",label:"Hot Round",desc:"36+ Stableford pts"});
          if(bestPts>=40) earned.push({icon:"💥",label:"Superstar",desc:"40+ Stableford pts"});
          if(bestGross<80) earned.push({icon:"🎯",label:"Sub 80",desc:"Under 80 gross"});
          if(courses>=3) earned.push({icon:"🗺️",label:"Explorer",desc:"Played 3+ courses"});
          if(courses>=5) earned.push({icon:"🧭",label:"Traveller",desc:"Played 5+ courses"});

          const locked = [];
          if(playerRounds.length<5) locked.push({icon:"⛳",label:"Regular",desc:"Play 5 rounds"});
          if(playerRounds.length<10) locked.push({icon:"🔟",label:"10 Club",desc:"Play 10 rounds"});
          if(wins<5) locked.push({icon:"🏆",label:"Champion",desc:"Win 5 rounds"});
          if(bestPts<36) locked.push({icon:"🔥",label:"Hot Round",desc:"Score 36+ Stableford pts"});
          if(courses<5) locked.push({icon:"🧭",label:"Traveller",desc:"Play 5+ courses"});

          return {name, earned, locked, rounds:playerRounds.length, wins};
        });
      }, [history]);

      const totalRounds = history.length;
      const allPlayerNames = Object.keys(handicapTrend);

      return (
        <div style={{minHeight:"100vh",backgroundImage:`url(${BG_PHOTO})`,backgroundSize:"cover",backgroundPosition:"center",backgroundRepeat:"no-repeat",backgroundAttachment:"fixed",padding:"20px 16px 30px",color:"#fff",fontFamily:"Georgia,serif"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <div>
              <div style={{fontSize:24,fontWeight:900,letterSpacing:-1}}>Card Caddie</div>
              <div style={{fontSize:11,color:"#86efac"}}>History & Stats</div>
            </div>
            <button onClick={onBack} style={{background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.2)",borderRadius:8,color:"#fff",padding:"6px 12px",fontSize:11,cursor:"pointer",fontFamily:"Georgia,serif"}}>← Back</button>
          </div>

          {history.length === 0 ? (
            <div style={{textAlign:"center",padding:"60px 20px",color:"rgba(255,255,255,0.4)"}}>

              <div style={{fontSize:16,marginBottom:8}}>No rounds yet</div>
              <div style={{fontSize:13}}>Complete a round and share it to see your history, bests and leaderboard here</div>
            </div>
          ) : (
            <>
              {/* Tabs — two rows for 5 tabs */}
              <div style={{display:"flex",gap:5,marginBottom:6}}>
                {[["rounds","📋"],["bests","🏅"],["board","🏆"]].map(([v,label]) => (
                  <button key={v} onClick={() => setTab(v)} style={{
                    flex:1,padding:"8px 0",borderRadius:14,border:"1px solid rgba(255,255,255,0.2)",

              </div>
              <div style={{display:"flex",gap:5,marginBottom:14}}>

              {/* ── ROUNDS TAB ── */}
              {tab==="rounds" && (
                <>
                  {history.map((round) => (
                    <div key={round.id} style={{background:"rgba(10,61,31,0.85)",borderRadius:16,padding:16,marginBottom:12,border:"1px solid rgba(255,255,255,0.08)"}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
                        <div>
                          <div style={{fontWeight:700,fontSize:15,marginBottom:2}}>{round.course}</div>
                          <div style={{fontSize:11,color:"#86efac"}}>{round.date} · {FORMAT_LABELS[round.format]||round.format} · {round.holesCount} holes</div>

                      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                        {round.players.map((p,pi) => {
                          const isStable = round.format==="stableford"||round.format==="tournament";

                            <div key={pi} style={{flex:1,minWidth:80,background:"rgba(255,255,255,0.06)",borderRadius:10,padding:"8px 10px",textAlign:"center"}}>

                  <div style={{textAlign:"center",marginTop:16}}>
                    {!confirmClear ? (

                        <div style={{display:"flex",gap:8,justifyContent:"center"}}>
                          <button onClick={handleClear} style={{background:"rgba(239,68,68,0.3)",border:"1px solid #ef4444",borderRadius:8,color:"#fff",padding:"8px 16px",fontSize:12,cursor:"pointer",fontFamily:"Georgia,serif"}}>Yes, clear it</button>
                          <button onClick={() => setConfirmClear(false)} style={{background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.2)",borderRadius:8,color:"#fff",padding:"8px 16px",fontSize:12,cursor:"pointer",fontFamily:"Georgia,serif"}}>Cancel</button>
                        </div>
                      </div>
                    )}
                  </div>
                </>
              )}

              {/* ── BESTS TAB ── */}
              {tab==="bests" && (
                <>
                  <div style={{fontSize:12,color:"rgba(255,255,255,0.5)",marginBottom:14,textAlign:"center"}}>
                    Your best result saved per course · last {totalRounds} round{totalRounds!==1?"s":""}
                  </div>
                  {personalBests.length===0 ? (
                    <div style={{textAlign:"center",padding:"40px 20px",color:"rgba(255,255,255,0.4)",fontSize:13}}>No bests yet — play and save a round!</div>
                  ) : personalBests.map((b,i) => (
                    <div key={i} style={{background:"rgba(10,61,31,0.85)",borderRadius:14,padding:14,marginBottom:10,display:"flex",justifyContent:"space-between",alignItems:"center",border:"1px solid rgba(251,191,36,0.2)"}}>
                      <div>
                        <div style={{fontWeight:700,fontSize:14,color:"#fbbf24"}}>🏅 {b.player}</div>
                        <div style={{fontSize:12,color:"rgba(255,255,255,0.6)"}}>{b.course}</div>
                        <div style={{fontSize:10,color:"rgba(255,255,255,0.35)"}}>{b.date}</div>
                      </div>
                      <div style={{textAlign:"right"}}>
                        <div style={{fontSize:24,fontWeight:900,color:"#fff"}}>{b.val}</div>
                        <div style={{fontSize:10,color:"rgba(255,255,255,0.4)"}}>{b.isStable?"pts":"gross"}</div>
                      </div>
                    </div>
                  ))}
                </>
              )}

              {/* ── BOARD TAB ── */}
              {tab==="board" && (
                <>
                  <div style={{fontSize:12,color:"rgba(255,255,255,0.5)",marginBottom:14,textAlign:"center"}}>
                    Most round wins · last {totalRounds} round{totalRounds!==1?"s":""}
                  </div>
                  {allTimeBoard.length===0 ? (
                    <div style={{textAlign:"center",padding:"40px 20px",color:"rgba(255,255,255,0.4)",fontSize:13}}>No wins recorded yet — play a multiplayer round!</div>
                  ) : allTimeBoard.map((p,rank) => (
                    <div key={p.name} style={{background:"rgba(10,61,31,0.85)",borderRadius:14,padding:16,marginBottom:10,display:"flex",justifyContent:"space-between",alignItems:"center",border:"2px solid "+(rank===0?"#fbbf24":"rgba(255,255,255,0.08)")}}>
                      <div style={{display:"flex",alignItems:"center",gap:10}}>
                        <span style={{fontSize:22}}>{["🥇","🥈","🥉"][rank]||"⛳"}</span>
                        <div style={{fontWeight:700,fontSize:16}}>{p.name}</div>
                      </div>
                      <div style={{textAlign:"right"}}>
                        <div style={{fontSize:26,fontWeight:900,color:rank===0?"#fbbf24":"#fff"}}>{p.count}</div>
                        <div style={{fontSize:10,color:"rgba(255,255,255,0.4)"}}>win{p.count!==1?"s":""}</div>
                      </div>
                    </div>
                  ))}
                </>
              )}

              {/* ── HANDICAP TREND TAB ── */}
              {tab==="hdcp" && (
                <>
                  <div style={{fontSize:12,color:"rgba(255,255,255,0.5)",marginBottom:14,textAlign:"center"}}>
                    Handicap per round · Stableford formats only
                  </div>
                  {allPlayerNames.length===0 ? (
                    <div style={{textAlign:"center",padding:"40px 20px",color:"rgba(255,255,255,0.4)",fontSize:13}}>No Stableford rounds saved yet</div>
                  ) : allPlayerNames.map((name,ni) => {
                    const rounds = handicapTrend[name];
                    if(!rounds||rounds.length===0) return null;
                    const W=300, H=110, pad=24;
                    const vals = rounds.map(r=>r.handicap);
                    const minV = Math.max(0, Math.min(...vals)-2);
                    const maxV = Math.min(54, Math.max(...vals)+2);
                    const range = maxV-minV||1;
                    const xStep = rounds.length>1?(W-pad*2)/(rounds.length-1):0;
                    const pts = rounds.map((r,i)=>({
                      x:pad+i*xStep,
                      y:H-pad-((r.handicap-minV)/range)*(H-pad*2),
                      ...r
                    }));
                    const pathParts = pts.map((p,i)=>(i===0?"M":"L")+p.x.toFixed(1)+","+p.y.toFixed(1));
                    const pathD = pathParts.join(" ");
                    const latest = rounds[rounds.length-1];
                    const first = rounds[0];
                    const trend = latest.handicap < first.handicap ? "📉 Improving" : latest.handicap > first.handicap ? "📈 Rising" : "➡️ Steady";
                    return (
                      <div key={name} style={{background:"rgba(10,61,31,0.85)",borderRadius:14,padding:16,marginBottom:14,border:"1px solid rgba(255,255,255,0.08)"}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                          <div>
                            <div style={{fontSize:14,fontWeight:700,color:PLAYER_COLORS[ni%4]}}>{name}</div>
                            <div style={{fontSize:11,color:"rgba(255,255,255,0.5)"}}>{trend} · {rounds.length} round{rounds.length!==1?"s":""}</div>
                          </div>
                          <div style={{textAlign:"right"}}>
                            <div style={{fontSize:28,fontWeight:900,color:"#fff"}}>{latest.handicap}</div>
                            <div style={{fontSize:10,color:"rgba(255,255,255,0.4)"}}>current hdcp</div>
                          </div>
                        </div>
                        {rounds.length >= 2 && (
                          <svg width="100%" viewBox={"0 0 "+W+" "+H} style={{overflow:"visible"}}>
                            {[0,1,2].map(i => {
                              const y = pad + i*(H-pad*2)/2;
                              const v = Math.round(maxV - i*range/2);
                              return <g key={i}>
                                <line x1={pad} y1={y} x2={W-pad} y2={y} stroke="rgba(255,255,255,0.08)" strokeWidth="1"/>
                                <text x={pad-4} y={y+4} fill="rgba(255,255,255,0.3)" fontSize="8" textAnchor="end">{v}</text>
                              </g>;
                            })}
                            <path d={pathD} fill="none" stroke={PLAYER_COLORS[ni%4]} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                            {pts.map((p,i) => (
                              <g key={i}>
                                <circle cx={p.x} cy={p.y} r="4" fill={PLAYER_COLORS[ni%4]} stroke="#fff" strokeWidth="1.5"/>
                                <text x={p.x} y={H-4} fill="rgba(255,255,255,0.4)" fontSize="7" textAnchor="middle">{p.course}</text>
                              </g>
                            ))}
                          </svg>
                        )}
                      </div>
                    );
                  })}
                </>
              )}

              {/* ── BADGES TAB ── */}
              {tab==="badges" && (
                <>
                  <div style={{fontSize:12,color:"rgba(255,255,255,0.5)",marginBottom:14,textAlign:"center"}}>
                    Achievements earned from your saved rounds
                  </div>
                  {badges.length===0 ? (
                    <div style={{textAlign:"center",padding:"40px 20px",color:"rgba(255,255,255,0.4)",fontSize:13}}>Play and save rounds to earn badges!</div>
                  ) : badges.map((player,pi) => (
                    <div key={player.name} style={{background:"rgba(10,61,31,0.85)",borderRadius:14,padding:16,marginBottom:14,border:"1px solid rgba(255,255,255,0.08)"}}>
                      <div style={{fontSize:14,fontWeight:700,color:PLAYER_COLORS[pi%4],marginBottom:12}}>
                        {player.name} · {player.rounds} round{player.rounds!==1?"s":""} · {player.wins} win{player.wins!==1?"s":""}
                      </div>
                      {player.earned.length > 0 && (
                        <>
                          <div style={{fontSize:10,color:"#86efac",letterSpacing:1,marginBottom:8}}>EARNED</div>
                          <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:12}}>
                            {player.earned.map((b,i) => (
                              <div key={i} style={{background:"rgba(134,239,172,0.1)",border:"1px solid rgba(134,239,172,0.3)",borderRadius:10,padding:"8px 10px",textAlign:"center",minWidth:70}}>
                                <div style={{fontSize:22}}>{b.icon}</div>
                                <div style={{fontSize:10,fontWeight:700,color:"#86efac",marginTop:2}}>{b.label}</div>
                                <div style={{fontSize:9,color:"rgba(255,255,255,0.4)",marginTop:1}}>{b.desc}</div>
                              </div>
                            ))}
                          </div>
                        </>
                      )}
                      {player.locked.length > 0 && (
                        <>
                          <div style={{fontSize:10,color:"rgba(255,255,255,0.3)",letterSpacing:1,marginBottom:8}}>LOCKED</div>
                          <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                            {player.locked.map((b,i) => (
                              <div key={i} style={{background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:10,padding:"8px 10px",textAlign:"center",minWidth:70,opacity:0.5}}>
                                <div style={{fontSize:22,filter:"grayscale(1)"}}>🔒</div>
                                <div style={{fontSize:10,fontWeight:700,color:"rgba(255,255,255,0.4)",marginTop:2}}>{b.label}</div>
                                <div style={{fontSize:9,color:"rgba(255,255,255,0.3)",marginTop:1}}>{b.desc}</div>
                              </div>
                            ))}
                          </div>
                        </>
                      )}
                    </div>
                  ))}
                </>
              )}
            </>
          )}
        </div>
      );
    }

    function ShareCard({ gameState, scores, ambScores, onClose }) {
      const { players, course, format, nineHoles, tournType } = gameState;
      const isStable = format==="stableford"||(format==="tournament"&&tournType!=="ambrose");
      const isAnyAmb = format==="ambrose"||(format==="tournament"&&tournType==="ambrose");
      const totalPar = course.holes.reduce((s,h)=>s+h.par,0);
      const rankEmoji = ["🥇","🥈","🥉","4️⃣"];
      const date = new Date().toLocaleDateString("en-AU",{day:"numeric",month:"long",year:"numeric"});
      const getGross = (pi) => isAnyAmb ? ambScores.reduce((s,v)=>s+(parseInt(v)||0),0) : scores[pi].reduce((s,v)=>s+(parseInt(v)||0),0);
      const getPts = (pi) => course.holes.reduce((sum,h,i)=>{
        const s=isAnyAmb?ambScores[i]:scores[pi][i]; if(!s) return sum;
        return sum+(stablefordPts(s,h.par,shotsReceived(h.si,players[pi].handicap,nineHoles))||0);
      },0);
      const sorted = [...players.map((p,i)=>({...p,idx:i}))].sort((a,b)=>isStable?getPts(b.idx)-getPts(a.idx):getGross(a.idx)-getGross(b.idx));
      const winner = sorted[0];
      const [imgUrl, setImgUrl] = React.useState(null);
      const [generating, setGenerating] = React.useState(false);

      const COLORS = ["#22d3ee","#86efac","#f9a8d4","#fbbf24"];

      // Generate PNG share image using canvas
      const generateImage = React.useCallback(() => {
        setGenerating(true);
        const canvas = document.createElement("canvas");
        const W = 800, H = 600 + sorted.length * 90;
        canvas.width = W; canvas.height = H;
        const ctx = canvas.getContext("2d");

        // Background gradient
        const grad = ctx.createLinearGradient(0,0,W,H);
        grad.addColorStop(0,"#0a1f0f");
        grad.addColorStop(0.5,"#0f2d18");
        grad.addColorStop(1,"#0a1f0f");
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,W,H);

        // Subtle texture overlay
        ctx.fillStyle = "rgba(255,255,255,0.02)";
        for(let y=0;y<H;y+=4){ ctx.fillRect(0,y,W,2); }

        // Top accent bar
        const bar = ctx.createLinearGradient(0,0,W,0);
        bar.addColorStop(0,"#16a34a");
        bar.addColorStop(0.5,"#22c55e");
        bar.addColorStop(1,"#16a34a");
        ctx.fillStyle = bar;
        ctx.fillRect(0,0,W,6);

        // Card Caddie logo text
        ctx.textAlign = "center";
        ctx.fillStyle = "#86efac";
        ctx.font = "bold 22px Georgia, serif";
        ctx.letterSpacing = "6px";
        ctx.fillText("CARD CADDIE", W/2, 60);

        // ⛳ emoji
        ctx.font = "36px serif";
        ctx.fillText("⛳", W/2, 110);

        // Course name
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 34px Georgia, serif";
        ctx.letterSpacing = "0px";
        ctx.fillText(course.name, W/2, 155);

        // Date + format
        ctx.fillStyle = "rgba(255,255,255,0.5)";
        ctx.font = "18px Georgia, serif";
        ctx.fillText(date + "  ·  " + (FORMAT_LABELS[format]||format) + "  ·  " + (nineHoles?"9 holes":"18 holes"), W/2, 190);

        // Divider
        ctx.strokeStyle = "rgba(134,239,172,0.3)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(60,215); ctx.lineTo(W-60,215);
        ctx.stroke();

        // Player rows
        sorted.forEach((p,rank) => {
          const y = 240 + rank * 90;
          const val = isStable ? getPts(p.idx) : getGross(p.idx);
          const diff = getGross(p.idx) - totalPar;
          const isWinner = rank === 0;

          // Row background
          const rowGrad = ctx.createLinearGradient(40,y,W-40,y+70);
          if(isWinner){
            rowGrad.addColorStop(0,"rgba(251,191,36,0.18)");
            rowGrad.addColorStop(1,"rgba(251,191,36,0.06)");
          } else {
            rowGrad.addColorStop(0,"rgba(255,255,255,0.07)");
            rowGrad.addColorStop(1,"rgba(255,255,255,0.03)");
          }
          ctx.fillStyle = rowGrad;
          ctx.beginPath();
          ctx.roundRect(40, y, W-80, 72, 14);
          ctx.fill();

          // Row border
          ctx.strokeStyle = isWinner ? "rgba(251,191,36,0.5)" : "rgba(255,255,255,0.1)";
          ctx.lineWidth = isWinner ? 2 : 1;
          ctx.beginPath();
          ctx.roundRect(40, y, W-80, 72, 14);
          ctx.stroke();

          // Rank emoji
          ctx.font = "30px serif";
          ctx.textAlign = "left";
          ctx.fillText(rankEmoji[rank], 68, y+46);

          // Player name
          ctx.fillStyle = COLORS[p.idx % 4];
          ctx.font = "bold 24px Georgia, serif";
          ctx.fillText(p.name, 120, y+38);

          // Handicap
          ctx.fillStyle = "rgba(255,255,255,0.35)";
          ctx.font = "14px Georgia, serif";
          ctx.fillText("Hdcp " + p.handicap, 120, y+60);

          // Score
          ctx.textAlign = "right";
          ctx.fillStyle = isWinner ? "#fbbf24" : COLORS[p.idx % 4];
          ctx.font = "bold 40px Georgia, serif";
          ctx.fillText(val||"—", W-70, y+48);

          // Label
          ctx.fillStyle = "rgba(255,255,255,0.4)";
          ctx.font = "14px Georgia, serif";
          ctx.fillText(isStable ? "pts" : (diff===0?"Even":diff>0?"+"+diff:diff), W-70, y+66);
        });

        // Winner banner
        const bannerY = 240 + sorted.length * 90 + 20;
        const bannerGrad = ctx.createLinearGradient(60,bannerY,W-60,bannerY+50);
        bannerGrad.addColorStop(0,"rgba(251,191,36,0.25)");
        bannerGrad.addColorStop(1,"rgba(251,191,36,0.1)");
        ctx.fillStyle = bannerGrad;
        ctx.beginPath();
        ctx.roundRect(60, bannerY, W-120, 50, 12);
        ctx.fill();
        ctx.strokeStyle = "rgba(251,191,36,0.4)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(60, bannerY, W-120, 50, 12);
        ctx.stroke();
        ctx.textAlign = "center";
        ctx.fillStyle = "#fbbf24";
        ctx.font = "bold 22px Georgia, serif";

        ctx.font = "15px Georgia, serif";
        ctx.fillText("Scored with Card Caddie  ·  cardcaddie.netlify.app", W/2, H-25);

        // Bottom accent bar
        ctx.fillStyle = bar;
        ctx.fillRect(0,H-5,W,5);

        setImgUrl(canvas.toDataURL("image/png"));
        setGenerating(false);
      }, [sorted, course, date, format, nineHoles, winner]);

    function DistanceScreen({ onBack, windSpeed, windDir: wDir, temp }) {

      const [uphill, setUphill] = React.useState(false);
      const [downhill, setDownhill] = React.useState(false);
      const [ballAbove, setBallAbove] = React.useState(false);
      const [ballBelow, setBallBelow] = React.useState(false);
      const [slopeLeft, setSlopeLeft] = React.useState(false);
      const [slopeRight, setSlopeRight] = React.useState(false);
      const [lie, setLie] = React.useState('fairway');
      const [activeTab, setActiveTab] = React.useState('distance');

      const CLUBS = [
        {name:"Driver",dist:230},{name:"3 Wood",dist:210},{name:"5 Wood",dist:195},
        {name:"3 Iron",dist:185},{name:"4 Iron",dist:175},{name:"5 Iron",dist:165},
        {name:"6 Iron",dist:155},{name:"7 Iron",dist:145},{name:"8 Iron",dist:135},
        {name:"9 Iron",dist:125},{name:"PW",dist:115},{name:"GW",dist:100},
        {name:"SW",dist:85},{name:"LW",dist:70},
      ];

      const windAdj = windSpeed ? Math.round((windSpeed / 10) * 8) : 0;
      const slopeAdj = uphill ? 10 : downhill ? -8 : 0;
      const tempAdj = temp ? Math.round((temp - 20) * 0.3) : 0;
      const lieAdj = lie==='rough' ? 5 : lie==='tight' ? -3 : lie==='bunker' ? 15 : 0;
      const ballPosAdj = ballAbove ? -5 : ballBelow ? 5 : 0;
      const totalAdj = windAdj + slopeAdj + tempAdj + lieAdj + ballPosAdj;
      const targetDist = parseInt(dist) ? parseInt(dist) + totalAdj : 0;

      const recommended = CLUBS.reduce((best, club) => {
        const diff = Math.abs(club.dist - targetDist);
        const bestDiff = Math.abs((best ? best.dist : 9999) - targetDist);
        return diff < bestDiff ? club : best;

      if(slopeLeft) caddieNotes.push({icon:"⚠️", text:"Slope left — ground falls away left, ball will move right. Aim left of target to compensate."});
      if(slopeRight) caddieNotes.push({icon:"⚠️", text:"Slope right — ground falls away right, ball will move left. Aim right of target to compensate."});
      if(lie==='rough') caddieNotes.push({icon:"🌿", text:"Rough lie — less spin and control. Take more club and expect it to run out further."});
      if(lie==='tight') caddieNotes.push({icon:"🏌️", text:"Tight lie — clean contact is key. Play the ball slightly back, keep hands ahead."});
      if(lie==='bunker') caddieNotes.push({icon:"⛏️", text:"Bunker shot — open the face, dig your feet in, hit 5cm behind the ball. Don't look at the ball!"});
      if(windSpeed > 20) caddieNotes.push({icon:"💨", text:"Strong wind — keep it low. Take more club and make a 3/4 swing to keep trajectory down."});
      if(tempAdj > 2) caddieNotes.push({icon:"☀️", text:"Hot conditions — ball is flying further today. Consider taking half a club less."});
      if(tempAdj < -2) caddieNotes.push({icon:"🥶", text:"Cold conditions — ball won't travel as far. Take an extra half club."});
      if(uphill) caddieNotes.push({icon:"⛰️", text:"Uphill shot — play to the top of the slope, not the flag. Ball will land shorter."});
      if(downhill) caddieNotes.push({icon:"⬇️", text:"Downhill shot — ball will run out more. Take less club and land it short of the flag."});

      const ToggleBtn = ({active, onClick, label, color="#86efac"}) => (
        <button onClick={onClick} style={{flex:1,padding:"8px 4px",borderRadius:10,border:"1.5px solid "+(active?color:"rgba(255,255,255,0.12)"),background:active?color+"22":"transparent",color:active?color:"rgba(255,255,255,0.45)",fontWeight:700,fontSize:11,cursor:"pointer",fontFamily:"Georgia,serif",lineHeight:1.3,whiteSpace:"pre-line"}}>{label}</button>

      return (
        <div style={{minHeight:"100vh",backgroundImage:`url(${BG_PHOTO})`,backgroundSize:"cover",backgroundPosition:"center",padding:"14px 14px 30px",color:"#fff",fontFamily:"Georgia,serif"}}>

                  <ToggleBtn active={slopeRight} onClick={()=>{setSlopeRight(!slopeRight);setSlopeLeft(false);}} label={"↘️ Slope\nRight"} color="#fbbf24" />

              <div style={{background:"rgba(10,61,31,0.85)",borderRadius:14,padding:12,marginBottom:10}}>
                <div style={{fontSize:11,color:"#86efac",letterSpacing:1,marginBottom:8}}>BALL POSITION</div>
                <div style={{display:"flex",gap:6}}>
                  <ToggleBtn active={ballAbove} onClick={()=>{setBallAbove(!ballAbove);setBallBelow(false);}} label={"⬆️ Ball\nAbove Feet"} color="#60a5fa" />
                  <ToggleBtn active={ballBelow} onClick={()=>{setBallBelow(!ballBelow);setBallAbove(false);}} label={"⬇️ Ball\nBelow Feet"} color="#60a5fa" />

              <div style={{background:"rgba(10,61,31,0.85)",borderRadius:14,padding:12,marginBottom:10}}>

                <div style={{display:"flex",gap:5}}>
                  {[["fairway","🌱 Fair"],["rough","🌿 Rough"],["tight","⬜ Tight"],["bunker","⛏️ Sand"]].map(([v,l])=>(
                    <button key={v} onClick={()=>setLie(v)} style={{flex:1,padding:"8px 2px",borderRadius:10,border:"1.5px solid "+(lie===v?"#86efac":"rgba(255,255,255,0.12)"),background:lie===v?"rgba(134,239,172,0.15)":"transparent",color:lie===v?"#86efac":"rgba(255,255,255,0.45)",fontWeight:700,fontSize:10,cursor:"pointer",fontFamily:"Georgia,serif"}}>{l}</button>

          {activeTab==='tips' && (
            <div>
              {[

    // ── FORFEIT GOLF MODE ───────────────────────────────────────────────────
    function ForfeitScreen({ onBack }) {
      const FORFEITS = [
        {icon:"🏌️",text:"Tee off on your knees"},
        {icon:"🏒",text:"Each player takes a club out of your bag"},
        {icon:"🪄",text:"Pitching wedge only off the tee"},
        {icon:"⛏️",text:"Sand wedge only for the entire hole"},
        {icon:"🔙",text:"Play from the back tees"},
        {icon:"🍺",text:"Buy a round at the 19th"},
        {icon:"🤐",text:"Complete silence from playing partners"},
        {icon:"🎯",text:"Putt with your driver"},
        {icon:"🙈",text:"Tee off without a practice swing"},
        {icon:"👟",text:"Tee off standing on one leg"},
        {icon:"🏃",text:"Tee off like Happy Gilmore — full running start!"},
        {icon:"🤐",text:"No talking for the entire next hole"},
        {icon:"🌀",text:"Spin around 3 times before teeing off"},
        {icon:"🍺",text:"Buy everyone in the group a drink at the 19th hole"},
      ];

      const [spinning, setSpinning] = React.useState(false);
      const [result, setResult] = React.useState(null);
      const [rotation, setRotation] = React.useState(0);
      const [spinAngle, setSpinAngle] = React.useState(0);

      const [jackpot, setJackpot] = React.useState(false);
      const spin = () => {
        if(spinning) return;
        setSpinning(true);
        setResult(null);
        setJackpot(false);
        // 5% chance of jackpot
        const isJackpot = Math.random() < 0.05;
        const winner = Math.floor(Math.random() * FORFEITS.length);
        const spinDeg = 1440 + (winner * (360/FORFEITS.length)) + Math.random() * (360/FORFEITS.length);
        setSpinAngle(prev => prev + spinDeg);
        setTimeout(() => {
          if(isJackpot) {
            setJackpot(true);
            setResult(null);
          } else {
            setResult(FORFEITS[winner]);
          }
          setSpinning(false);
        }, 3500);
      };

      const sliceAngle = 360 / FORFEITS.length;

      return (
        <div style={{minHeight:"100vh",backgroundImage:"var(--cc-bg)",backgroundSize:"cover",backgroundPosition:"center",padding:"20px 16px 30px",color:"#fff",fontFamily:"Georgia,serif"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
            <div><div style={{fontSize:22,fontWeight:900,letterSpacing:-1}}>Card Caddie</div><div style={{fontSize:10,color:"#f87171"}}>🎲 Forfeit Golf</div></div>
            <button onClick={onBack} style={{background:"rgba(0,0,0,0.4)",border:"1px solid rgba(255,255,255,0.2)",borderRadius:8,color:"#fff",padding:"6px 12px",fontSize:11,cursor:"pointer",fontFamily:"Georgia,serif"}}>Back</button>
          </div>

          <div style={{textAlign:"center",marginBottom:20}}>
            <div style={{fontSize:13,color:"rgba(255,255,255,0.6)",marginBottom:16}}>Lose a hole? Spin the wheel for your forfeit! 😈</div>

            {/* Spin Wheel */}
            <div style={{position:"relative",width:300,height:300,margin:"0 auto 20px"}}>
              <svg width="300" height="300" style={{transform:"rotate("+spinAngle+"deg)",transition:spinning?"transform 3.5s cubic-bezier(0.17,0.67,0.12,0.99)":"none",display:"block"}}>
                {/* RAF Roundel — proper concentric rings */}
                <circle cx="150" cy="150" r="145" fill="#1e3a8a"/>
                <circle cx="150" cy="150" r="105" fill="#ffffff"/>
                <circle cx="150" cy="150" r="65" fill="#dc2626"/>
                <circle cx="150" cy="150" r="28" fill="#ffffff"/>
                <circle cx="150" cy="150" r="12" fill="#1e3a8a"/>

                {/* All 14 forfeit icons evenly around outer blue ring */}
                {FORFEITS.map((f,i) => {
                  const angle = (i * (360/FORFEITS.length) - 90) * Math.PI / 180;
                  return (
                    <text key={i} x={150+122*Math.cos(angle)} y={150+122*Math.sin(angle)}
                      fontSize="17" textAnchor="middle" dominantBaseline="middle">{f.icon}</text>
                  );
                })}

                {/* Ring dividers */}
                <circle cx="150" cy="150" r="145" fill="none" stroke="rgba(255,255,255,0.3)" strokeWidth="2"/>
                <circle cx="150" cy="150" r="105" fill="none" stroke="rgba(0,0,0,0.1)" strokeWidth="1.5"/>
                <circle cx="150" cy="150" r="65" fill="none" stroke="rgba(255,255,255,0.3)" strokeWidth="1.5"/>
                <circle cx="150" cy="150" r="28" fill="none" stroke="rgba(0,0,0,0.1)" strokeWidth="1"/>
              </svg>
              {/* Pointer */}
              <div style={{position:"absolute",top:-8,left:"50%",transform:"translateX(-50%)",fontSize:24}}>▼</div>
            </div>

            <button onClick={spin} disabled={spinning} style={{padding:"14px 40px",borderRadius:14,border:"none",background:spinning?"rgba(255,255,255,0.1)":"linear-gradient(135deg,#dc2626,#ef4444)",color:"#fff",fontSize:16,fontWeight:800,cursor:spinning?"not-allowed":"pointer",fontFamily:"Georgia,serif",marginBottom:16}}>
              {spinning?"Spinning...":"🎲 SPIN!"}
            </button>

            {result && !spinning && (
              <div style={{background:"linear-gradient(135deg,rgba(239,68,68,0.2),rgba(220,38,38,0.1))",border:"2px solid #ef4444",borderRadius:16,padding:20}}>
                <div style={{fontSize:11,color:"#f87171",letterSpacing:1,marginBottom:8}}>YOUR FORFEIT</div>
                <div style={{fontSize:40,marginBottom:10}}>{result.icon}</div>
                <div style={{fontSize:16,fontWeight:700,color:"#fff"}}>{result.text}</div>
                <div style={{fontSize:12,color:"rgba(255,255,255,0.5)",marginTop:8}}>Good luck... 😈</div>
              </div>
            )}
            {jackpot && !spinning && (
              <div style={{background:"linear-gradient(135deg,rgba(251,191,36,0.3),rgba(245,158,11,0.2))",border:"2px solid #fbbf24",borderRadius:16,padding:20,textAlign:"center"}}>
                <div style={{fontSize:36,marginBottom:6}}>🎯</div>
                <div style={{fontSize:16,fontWeight:900,color:"#fbbf24",marginBottom:6}}>JACKPOT!</div>
                <div style={{fontSize:13,color:"#fff",marginBottom:8}}>You hit the bullseye!</div>
                <div style={{fontSize:14,fontWeight:700,color:"#fbbf24"}}>You choose which club your playing partners must use for the entire next hole! 😈⛳</div>
              </div>
            )}
          </div>

          <div style={{background:"rgba(10,61,31,0.85)",borderRadius:14,padding:14}}>
            <div style={{fontSize:11,color:"#86efac",letterSpacing:1,marginBottom:10}}>ALL FORFEITS</div>
            {FORFEITS.map((f,i) => (
              <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0",borderBottom:"1px solid rgba(255,255,255,0.06)"}}>
                <span style={{fontSize:18,width:24,textAlign:"center"}}>{f.icon}</span>
                <span style={{fontSize:12,color:"rgba(255,255,255,0.7)"}}>{f.text}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }


    // ── PLAYER ID SCREEN ──────────────────────────────────────────────────────
    function PlayerIdScreen({ onBack }) {
      const [playerId] = React.useState(() => getOrCreatePlayerId());
      const [email, setEmail] = React.useState('');
      const [saved, setSaved] = React.useState(false);
      const [copying, setCopying] = React.useState(false);

      const copyId = () => {
        navigator.clipboard.writeText(playerId).then(()=>{
          setCopying(true);
          setTimeout(()=>setCopying(false),2000);
        }).catch(()=>alert('Your ID: '+playerId));
      };

      const saveEmail = async () => {
        if(!email.trim()) return;
        // Upsert player with email using the SAME playerId shown on screen
        await supaFetch('players?on_conflict=id', {
          method:'POST', prefer:'resolution=merge-duplicates',
          body: JSON.stringify({ id: playerId, email: email.trim(), name: 'Player' }),
        });
        setSaved(true);
      };

      return (
        <div style={{minHeight:"100vh",backgroundImage:"var(--cc-bg)",backgroundSize:"cover",backgroundPosition:"center",padding:"20px 16px 30px",color:"#fff",fontFamily:"Georgia,serif"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
            <div><div style={{fontSize:22,fontWeight:900,letterSpacing:-1}}>Card Caddie</div><div style={{fontSize:10,color:"#86efac"}}>🪪 Your Player ID</div></div>
            <button onClick={onBack} style={{background:"rgba(0,0,0,0.4)",border:"1px solid rgba(255,255,255,0.2)",borderRadius:8,color:"#fff",padding:"6px 12px",fontSize:11,cursor:"pointer",fontFamily:"Georgia,serif"}}>Back</button>
          </div>

          {/* ID Card */}
          <div style={{background:"linear-gradient(135deg,rgba(10,61,31,0.95),rgba(22,101,52,0.9))",borderRadius:18,padding:24,marginBottom:14,border:"1.5px solid #86efac",textAlign:"center"}}>
            <div style={{fontSize:11,color:"#86efac",letterSpacing:2,marginBottom:12}}>YOUR PLAYER ID</div>
            <div style={{fontSize:42,fontWeight:900,color:"#fff",letterSpacing:4,marginBottom:8}}>{playerId}</div>
            <div style={{fontSize:11,color:"rgba(255,255,255,0.5)",marginBottom:16}}>This is your unique Card Caddie identity</div>
            <button onClick={copyId} style={{padding:"10px 24px",borderRadius:10,border:"1px solid rgba(134,239,172,0.5)",background:"rgba(134,239,172,0.1)",color:"#86efac",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"Georgia,serif"}}>
              {copying?"✓ Copied!":"📋 Copy ID"}
